        body {

        /* HEADER / NAV */
        header {
            background: rgba(15, 15, 15, 0.95);

            border-bottom: 2px solid #E63946;
            backdrop-filter: blur(10px);
        }

        nav {

            justify-content: space-between;
            align-items: center;

        .logo {

            color: #FFF;
            letter-spacing: 2px;
        }

        .logo span {
            color: #E63946;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #CCC;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #E63946;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 1rem;
            }
            .nav-links {

                font-size: 0.9rem;
            }
        }
