<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ms Metal · Gestión</title>
<style>
/* VOICE: herramienta de taller, directa · IDEA: libreta de presupuestos digital · PICTURE: el presupuesto en vivo · COLOUR: azul Endura sobre gris claro · TYPE: Inter */
:root{color-scheme:light;--bg:#f2f4f8;--ink:#0f172a;--mute:#64748b;--line:#e3e8f0;--acc:#0a63ff;--acc2:#00b4ff;--ok:#16a34a;--warn:#c2410c;--bad:#dc2626;--wa:#25d366}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:#050b16;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:22px;mix-blend-mode:lighten}
header b{font-size:17px}
header small{display:block;color:#8fa0bd;font-size:11px;font-weight:500}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:24px;margin:4px 0 2px;letter-spacing:-.02em}
.d{color:var(--mute);font-size:13px;margin:0 0 14px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kp .card{margin:0}
.kl{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--mute);text-transform:uppercase}
.kv{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.02em;white-space:nowrap}
.ks{font-size:12px;color:var(--mute)}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #eef1f6}
.li:first-child{border-top:0}
.li .t{flex:1}
.li b{display:block;font-size:14.5px}
.li small{display:block;color:var(--mute);font-size:12px}
.r{text-align:right;font-weight:700;white-space:nowrap}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.t-env{background:#e0ecff;color:#0a4fd1}.t-apr{background:#fef3c7;color:#92400e}.t-ent{background:#dcfce7;color:#166534}.t-per{background:#f1f5f9;color:#64748b}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cfd6e2;border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:#e6eaf1;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;color:var(--mute);min-height:40px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:12px;border:0;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
.pri{background:var(--acc);color:#fff}.wa{background:var(--wa);color:#fff}.sec{background:#fff;color:var(--ink);box-shadow:0 0 0 1px #cfd6e2}.dan{background:#fff;color:var(--bad);box-shadow:0 0 0 1px #f3c4c4}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;padding:10px 0;min-height:44px}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfd}
.item .top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.x{border:0;background:none;color:var(--bad);font:inherit;font-weight:700;font-size:13px;padding:6px;min-height:36px}
.tot{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;border-radius:14px;padding:12px 14px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.tot b{font-size:22px;white-space:nowrap}
.tot small{color:#94a3b8;display:block;font-size:12px}
.low{color:var(--bad);font-weight:700}
.calc{margin-top:10px;background:#eef4ff;color:#0a3d9e;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600}
.perfil{display:block;width:100%;max-height:160px;margin-top:10px;background:#fff;border:1px dashed #cfd6e2;border-radius:10px}
.bar{height:6px;border-radius:4px;background:#e8ecf3;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0f172a;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;color:#94a3b8;font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center}
nav button svg{width:22px;height:22px}
nav button.on{color:#fff}nav button.on svg{color:var(--acc2)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:30px;box-shadow:0 10px 24px rgba(10,99,255,.4);z-index:6}
.modal{position:fixed;inset:0;background:rgba(5,11,22,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;z-index:30;white-space:nowrap}
.demo{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.empty{text-align:center;color:var(--mute);padding:20px 8px}
table.pr{width:100%;border-collapse:collapse;font-size:14px}
table.pr th{text-align:left;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:6px 4px}
table.pr td{padding:4px}
table.pr td:first-child{font-weight:700;white-space:nowrap}
table.pr input{min-height:40px;padding:8px;text-align:right}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>

  <div class="row" style="justify-content:space-between"><h1>N° ${String(p.num).padStart(4,'0')}</h1>${tag(p.estado)}</div>
  <p class="d">${esc(c.nombre)} · ${esc(c.origen || '')} · ${dmy(p.fecha)}${p.credito ? ' · <b>a crédito</b>' : ''}</p>
  <div class="card">${p.items.map(it => { const c = calc(it, p.trae); return `<div class="li"><div class="t"><b>${esc(it.desc || 'Trabajo')}</b><small>${it.tipo === 'otro' ? `${num(it.cant)} × ${fmt(it.precio)}` : `${it.tipo === 'galv' ? 'Galvanizada N° ' + esc(it.cal) : 'Negra ' + esc(it.esp)} · perfil ${segsDe(it.segs).join('-')} cm · ${num(it.piezas)} × ${num(it.largo)} m<br>${esc(c.info)}`}</small></div><span class="r">${fmt(c.total)}</span></div>`; }).join('')}
    <div class="li"><div class="t"><small>${p.trae ? 'Material del cliente' : 'Material ' + fmt(t.mat)} · Servicio ${fmt(t.serv)}</small><b>Total</b></div><span class="r" style="font-size:19px">${fmt(p.total)}</span></div>
    ${p.estado !== 'enviado' && p.estado !== 'perdido' ? `<div class="li"><div class="t"><b>Saldo</b><small>Cobrado ${fmt(pagado(p))}</small></div><span class="r ${sal?'low':''}">${fmt(sal)}</span></div>` : ''}
  </div>
  ${p.estado === 'enviado' ? `<button class="btn pri" data-act="aprobar">Cliente aprobó</button><button class="btn wa" data-act="wa">${waIcon()} Reenviar por WhatsApp</button><button class="btn dan" data-act="perdido">Marcar como perdido</button>` : ''}
  ${p.estado === 'aprobado' ? `${sal ? '<button class="btn pri" data-act="cobrar">Registrar pago</button>' : ''}<button class="btn sec" data-act="entregar">Marcar entregado</button>` : ''}
  ${p.estado === 'entregado' && sal ? '<button class="btn pri" data-act="cobrar">Registrar pago</button>' : ''}
  ${(p.pagos || []).length ? `<div class="card" style="margin-top:12px"><div class="kl">Pagos</div>${p.pagos.map(x => `<div class="li"><div class="t">${dmy(x.fecha)}</div><span class="r">${fmt(x.monto)}</span></div>`).join('')}</div>` : ''}`;
}
function sheet(html){ ui.innerHTML = `<div class="modal" data-close="1"><div class="sheet">${html}</div></div>`; }
function aprobar(p){
  sheet(`<h2>Cliente aprobó N° ${String(p.num).padStart(4,'0')}</h2><p class="d">Total ${fmt(p.total)}${p.trae ? '' : '. Se descuenta el material del stock.'}</p>
  <button class="btn pri" data-ap="mitad">Pagó la seña (50% · ${fmt(p.total/2)})</button>
  <button class="btn pri" data-ap="total">Pagó el total</button>
  <button class="btn sec" data-ap="nada">Todavía no pagó</button>
  <button class="btn sec" data-ap="credito">Es a crédito</button>`);
}
function descontar(p){
  if (p.trae || p.descontado) return;
  p.items.forEach(it => { const c = calc(it, false); if (it.tipo === 'galv') S.stock.galv[it.cal] = Math.max(0, (S.stock.galv[it.cal] || 0) - (c.ml || 0)); if (it.tipo === 'negra') S.stock.negra[it.esp] = Math.max(0, (S.stock.negra[it.esp] || 0) - (c.planchas || 0)); });
  p.descontado = true;
}
function cobrar(p){
  const s = saldo(p);
  sheet(`<h2>Registrar pago</h2><p class="d">${esc(cli(p.clienteId).nombre)} · saldo ${fmt(s)}</p>
  <button class="btn pri" data-pg="${s}">Pagó todo el saldo (${fmt(s)})</button>
  <label class="f" for="pgm">Otro monto</label><div class="row"><input id="pgm" inputmode="numeric" placeholder="₲"><button class="btn sec" style="width:auto;padding:0 18px" data-pg="otro">OK</button></div>`);
}
/* ---------- stock ---------- */
function vStock(){
  const fila = (g, k, u) => { const v = S.stock[g][k] || 0, m = S.min[g][k] || 0, low = v <= m; return `<div class="li"><div class="t"><b>${g === 'galv' ? 'N° ' + k : (k.includes('mm') ? k : 'N° ' + k)}</b><small>mínimo ${m} ${u}</small></div><span class="r ${low?'low':''}">${Math.round(v*10)/10} ${u}</span><button class="btn sec" style="width:auto;min-height:40px;padding:0 14px;margin:0" data-compra="${g}|${k}">+</button></div>`; };
  return `<h1>Stock</h1><p class="d">Se descuenta solo al aprobar un trabajo con tu material</p>
  <div class="card"><div class="kl">Galvanizada · metros de bobina</div>${GALV.map(k => fila('galv', k, 'm')).join('')}</div>
  <div class="card"><div class="kl">Chapa negra · planchas</div>${NEGRA.map(k => fila('negra', k, 'pl.')).join('')}</div>`;
}
function compra(g, k){
  const u = g === 'galv' ? 'metros' : 'planchas';
  sheet(`<h2>Entrada de ${g === 'galv' ? 'galvanizada N° ' + esc(k) : 'chapa negra ' + esc(k)}</h2><p class="d">¿Cuántos ${u} compraste?</p>
  <input id="cq" inputmode="decimal" placeholder="0"><label class="f" for="cm">Mínimo para avisarte</label><input id="cm" inputmode="decimal" value="${S.min[g][k] || 0}">
  <button class="btn pri" style="margin-top:12px" data-cok="${g}|${esc(k)}">Guardar</button>`);
}
/* ---------- cobros ---------- */
function vCobros(){
  const L = S.presus.filter(p => (p.estado === 'aprobado' || p.estado === 'entregado') && saldo(p) > 0).sort((a,b) => saldo(b) - saldo(a));
  const tot = L.reduce((s,p) => s + saldo(p), 0);
  return `<h1>Cobros</h1><p class="d">Quién te debe y cuánto</p>
  <div class="card"><div class="kl">Total por cobrar</div><div class="kv">${fmt(tot)}</div><div class="ks">${L.filter(p => p.credito).length} a crédito</div></div>
  <div class="card">${L.length ? L.map(p => `<div class="li" data-ver="${p.id}"><div class="t"><b>${esc(cli(p.clienteId).nombre)}</b><small>N° ${String(p.num).padStart(4,'0')} · ${p.credito ? 'a crédito' : EST[p.estado][0].toLowerCase()} · pagó ${fmt(pagado(p))}</small></div><span class="r low">${fmt(saldo(p))}</span></div>`).join('') : '<div class="empty">Nadie te debe</div>'}</div>`;
}
/* ---------- precios ---------- */
function vPrecios(){
  return `<h1>Precios</h1><p class="d">Con estos precios se calcula cada presupuesto</p>${demoNote()}
  <div class="card"><div class="kl">Galvanizada · bobina</div>
    <div class="g2"><div><label class="f" for="ab">Ancho de bobina (cm)</label><input id="ab" inputmode="decimal" data-p="anchoBobina" value="${S.precios.anchoBobina}"></div><div><label class="f" for="sg">Plegado por metro</label><input id="sg" inputmode="numeric" data-p="servGalv" value="${S.precios.servGalv}"></div></div>
    <table class="pr" style="margin-top:8px"><tr><th>Calibre</th><th>Metro lineal de bobina</th></tr>${GALV.map(k => `<tr><td>N° ${k}</td><td><input inputmode="numeric" data-p="galv|${k}|ml" value="${S.precios.galv[k].ml}"></td></tr>`).join('')}</table></div>
  <div class="card"><div class="kl">Chapa negra</div>
    <div class="g2"><div><label class="f" for="pa">Plancha: ancho (cm)</label><input id="pa" inputmode="decimal" data-p="planchaAncho" value="${S.precios.planchaAncho}"></div><div><label class="f" for="pl">Plancha: largo (cm)</label><input id="pl" inputmode="decimal" data-p="planchaLargo" value="${S.precios.planchaLargo}"></div></div>
    <table class="pr"><tr><th>Espesor</th><th>Plancha</th><th>Pliegue</th></tr>${NEGRA.map(k => `<tr><td>${k.includes('mm') ? k : 'N° ' + k}</td><td><input inputmode="numeric" data-p="negra|${k}|plancha" value="${S.precios.negra[k].plancha}"></td><td><input inputmode="numeric" data-p="negra|${k}|pliegue" value="${S.precios.negra[k].pliegue}"></td></tr>`).join('')}</table>
    <small class="ks">El precio por pieza se pone en cada presupuesto. El material se cobra según el desarrollo del perfil: el ancho de chapa que usa por el largo.</small></div>
  ${S.ejemplo ? '<button class="btn dan" data-reset="limpio">Borrar datos de ejemplo y empezar</button>' : '<button class="btn sec" data-reset="ejemplo">Volver a cargar el ejemplo</button>'}`;
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-ver],[data-lf],[data-tipo],[data-add],[data-del],[data-guardar],[data-act],[data-ap],[data-pg],[data-compra],[data-cok],[data-reset],[data-close]');
  if (!t) return;
  const D = t.dataset;
  if (D.close && e.target === t) { ui.innerHTML = ''; return; }
  if (D.go) return go(D.go);
  if (D.ver) { V.verId = D.ver; return go('ver'); }
  if (D.lf) { V.lf = D.lf; return render(); }
  if (D.tipo) { const [id, tp] = D.tipo.split(':'); const i = V.draft.items.findIndex(x => x.id === id); const o = V.draft.items[i], n = tp === 'galv' ? itemGalv() : tp === 'negra' ? itemNegra() : itemOtro(); n.desc = o.desc; if (o.segs && tp !== 'otro') { n.segs = o.segs; n.largo = o.largo; n.piezas = o.piezas; } V.draft.items[i] = n; return render(); }
  if (D.add) { V.draft.items.push(D.add === 'galv' ? itemGalv() : D.add === 'negra' ? itemNegra() : itemOtro()); render(); return window.scrollTo(0, document.body.scrollHeight); }
  if (D.del) { V.draft.items = V.draft.items.filter(x => x.id !== D.del); return render(); }
  if (D.guardar) return guardar(D.guardar);
  const p = S.presus.find(x => x.id === V.verId);
  if (D.act && p) {
    if (D.act === 'aprobar') return aprobar(p);
    if (D.act === 'wa') return abrirWa(p);
    if (D.act === 'perdido') { p.estado = 'perdido'; save(); toast('Marcado como perdido'); return render(); }
    if (D.act === 'entregar') { p.estado = 'entregado'; save(); toast('Trabajo entregado'); return render(); }
    if (D.act === 'cobrar') return cobrar(p);
  }
  if (D.ap && p) {
    p.estado = 'aprobado'; descontar(p);
    if (D.ap === 'mitad') p.pagos.push({fecha:hoy(), monto:Math.round(p.total/2)});
    if (D.ap === 'total') p.pagos.push({fecha:hoy(), monto:p.total});
    if (D.ap === 'credito') p.credito = true;
    save(); ui.innerHTML = ''; toast(p.trae ? 'Aprobado' : 'Aprobado · stock actualizado'); return render();
  }
  if (D.pg && p) {
    const m = D.pg === 'otro' ? num($('#pgm').value) : num(D.pg);
    if (!m) return toast('Poné un monto');
    p.pagos.push({fecha:hoy(), monto:Math.min(m, saldo(p))}); save(); ui.innerHTML = ''; toast('Pago registrado'); return render();
  }
  if (D.compra) { const [g, k] = D.compra.split('|'); return compra(g, k); }
  if (D.cok) { const [g, k] = D.cok.split('|'); S.stock[g][k] = (S.stock[g][k] || 0) + num($('#cq').value); S.min[g][k] = num($('#cm').value); save(); ui.innerHTML = ''; toast('Stock actualizado'); return render(); }
  if (D.reset) {
    if (D.reset === 'limpio') { const s = seed(); s.ejemplo = false; s.clientes = []; s.presus = []; s.nextNum = 1; GALV.forEach(k => s.stock.galv[k] = 0); NEGRA.forEach(k => s.stock.negra[k] = 0); S = s; }
    else S = seed();
    save(); toast(D.reset === 'limpio' ? 'Listo, empezás de cero' : 'Ejemplo cargado'); return go('inicio');
  }
});
document.addEventListener('input', e => {
  const t = e.target, D = t.dataset;
  if (V.route === 'nuevo' && V.draft) {
    if (D.k === 'clienteId') { V.draft.clienteId = t.value; return render(); }
    if (D.k === 'trae') { V.draft.trae = t.checked; return render(); }
    if (D.n) { V.draft.nuevo[D.n] = t.value; return; }
    if (D.i) { const [id, f] = D.i.split(':'); const it = V.draft.items.find(x => x.id === id); it[f] = t.value;
      if (f === 'modo' || f === 'cal' || f === 'esp') return render();
      if (f === 'segs') { const pw = $('#pw-' + id); if (pw) pw.innerHTML = perfilSvg(it.segs); }
      const ci = $('#ci-' + id); if (ci) ci.textContent = calc(it, V.draft.trae).info || 'Cargá las medidas y el sistema calcula el desarrollo, los pliegues y el material';
      const tt = totales(V.draft); $('#tt').textContent = fmt(tt.total); const sm = $('.tot small'); if (sm && !V.draft.trae) sm.textContent = `Material ${fmt(tt.mat)} · Servicio ${fmt(tt.serv)}`; return; }
  }
  if (D.p) { const v = num(t.value); if (!D.p.includes('|')) S.precios[D.p] = v; else { const [g, k, f] = D.p.split('|'); S.precios[g][k][f] = v; }
    S.presus.filter(p => p.estado === 'enviado').forEach(p => p.total = totales(p).total); save(); }
});
document.addEventListener('change', e => { if (e.target.dataset.p) toast('Precio guardado'); });
$('#fab').addEventListener('click', () => { newDraft(); go('nuevo'); });
render();
}
</script>
</body>
</html>
