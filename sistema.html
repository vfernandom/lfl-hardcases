function itemInfo(k){
  const t = String(k).slice(0,1), id = String(k).slice(2);
  if (t === 'm') { const m = matById(id) || {}; return {tipo:'material', nombre:m.nombre || '(material eliminado)', unidad:m.unidad || '', precio:+m.precio || 0, cta:CTA.inventario}; }
  if (t === 'p') { const p = S.productos.find(x => x.id === id) || {}; return {tipo:'producto', nombre:`${p.codigo || ''} ${p.nombre || '(producto eliminado)'}`.trim(), unidad:'u', precio:0, cta:CTA_ERP.terminados}; }
  const o = (S.ots || []).find(x => x.id === id) || {}; return {tipo:'medida', nombre:`${id} · case a medida${o.cliente ? ' · ' + o.cliente : ''}`, unidad:'u', precio:0, cta:CTA_ERP.terminados};
}
const SM_TXT = {inicial:'Inventario inicial', ajuste:'Ajuste de inventario', baja:'Baja', consumo:'Entrega de materiales a OT', devolucion:'Devolución de sobrante', produccion:'Ingreso de producto terminado', entrega:'Entrega al cliente'};
const SM_ORDEN = {inicial:0, consumo:1, devolucion:1.5, produccion:2, entrega:3, baja:4};
const presConOT = p => !!p.otGeneradas;
function eventosStock(){
  const ev = [];
  (S.compras || []).filter(c => !c.anulada).forEach(c => (c.items || []).forEach(i => { if (i.tipo === 'material' && i.materialId && +i.cantidad > 0)
    ev.push({fecha:c.fecha, ts:c.at || '', o:0, k:'m:' + i.materialId, cant:+i.cantidad, costo:ivaSplit(i.importe, i.tasaIva).neto, ref:'cp:' + c.id, txt:`Compra ${c.numeroFactura || ''} · ${provNombre(c.proveedorId)}`}); }));
  consumos().filter(c => { const p = S.presupuestos.find(x => x.id === c.presId); return !(p && presConOT(p)); })
    .forEach(c => ev.push({fecha:c.fecha, o:3, k:'m:' + c.materialId, cant:-c.cant, ref:'pr:' + c.presId, txt:`Venta ${c.presNum} (sin OT)`}));
  (S.stockajustes || []).filter(a => !a.anulado).forEach(a => ev.push({fecha:a.fecha, ts:a.at || '', o:+a.cantidad > 0 ? 0 : 4, k:'m:' + a.materialId, cant:+a.cantidad, ref:'sa:' + a.id, txt:`Ajuste · ${a.motivo || ''}`}));
  (S.stockmovs || []).filter(d => !d.anulado).forEach(d => (d.lineas || []).forEach((l, i) => {
    const sal = ['consumo','entrega','baja'].includes(d.tipo) || (d.tipo === 'ajuste' && +l.cant < 0);
    const q = Math.abs(+l.cant) * (sal ? -1 : 1);
    ev.push({fecha:d.fecha, ts:d.at || '', o: d.tipo === 'ajuste' ? (q > 0 ? 0 : 4) : SM_ORDEN[d.tipo], k:l.item, cant:q, costoUnit:l.costoUnit, tipo:d.tipo, otId:d.otId, ref:`sm:${d.id}:${i}`, txt:`${SM_TXT[d.tipo] || d.tipo}${d.otId ? ' · ' + d.otId : ''}${d.motivo ? ' · ' + d.motivo : ''}`});
  }));
  // mismo día: en el orden en que se registraron
  ev.sort((a,b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.ts || '') < (b.ts || '') ? -1 : (a.ts || '') > (b.ts || '') ? 1 : a.o - b.o);
  return ev;
}
function motorStock(){
  const st = {}, costoRef = {}, wip = {};
  eventosStock().forEach(e => {
    const info = itemInfo(e.k);
    const s = st[e.k] || (st[e.k] = {cant:0, valor:0, avg:info.precio, negativo:false, entradas:0, salidas:0, kardex:[]});
    let costo;
    if (e.cant > 0) {
      if (e.tipo === 'produccion') { costo = wip[e.otId] || 0; wip[e.otId] = 0; }
      else if (e.costo != null) costo = e.costo;
      else if (e.costoUnit != null && e.costoUnit !== '') costo = e.cant * (+e.costoUnit);
      else costo = e.cant * s.avg;
      s.cant += e.cant; s.valor += costo; s.entradas += e.cant; if (s.cant > 1e-9) s.avg = s.valor / s.cant;
      if (e.tipo === 'devolucion' && e.otId) wip[e.otId] = (wip[e.otId] || 0) - costo;
    } else {
      const q = -e.cant; costo = q * s.avg; s.cant -= q; s.valor -= costo; s.salidas += q;
      if (s.cant < -1e-6) s.negativo = true; if (Math.abs(s.cant) < 1e-9) { s.cant = 0; s.valor = 0; }
      if (e.tipo === 'consumo' && e.otId) wip[e.otId] = (wip[e.otId] || 0) + costo;
    }
    costoRef[e.ref] = (costoRef[e.ref] || 0) + costo;
    s.kardex.push({fecha:e.fecha, txt:e.txt, entrada:e.cant > 0 ? e.cant : 0, salida:e.cant < 0 ? -e.cant : 0, costo, saldo:s.cant, avg:s.avg, valor:s.valor});
  });
  return {st, costoRef, wip};
}

      if (d.tipo === 'inicial') L.push({cta:inv, debe:v}, {cta:CTA.capital, haber:v});

      else if (d.tipo === 'devolucion') L.push({cta:inv, debe:v}, {cta:CTA_ERP.wip, haber:v});
      else if (d.tipo === 'produccion') L.push({cta:inv, debe:v}, {cta:CTA_ERP.wip, haber:v});

    add(d.fecha, `${SM_TXT[d.tipo] || d.tipo}${d.otId ? ' · ' + d.otId : ''}${d.motivo ? ' · ' + d.motivo : ''}`, 'stock', d.id, L);

  if (!(await dialog(`Cerrar ${o.id}`, `Costo real: <b>${gs(r.total)}</b> (materiales ${gs(r.mat)} + mano de obra ${gs(r.mo)} + gastos ${gs(r.gf)}).${o.precio ? `<br>Margen real: <b style="color:${bajo ? 'var(--bad)' : 'var(--ok)'}">${pct(r.margenReal)}</b> (cotizado ${pct(o.margenCotizado || 0)}).` : ''}${bajo ? `<div class="note bad" style="margin-top:8px">${IC.warn}<div>Queda debajo del margen mínimo.</div></div>` : ''}<p class="small muted">Una OT cerrada no se modifica.</p>`, 'Cerrar OT'))) return;
  await patchOT(o.id, {estado:'cerrada', cierre:{...r, fecha:now(), por:S.me}}, `Cerrada · costo real ${gs(r.total)}${r.margenReal != null ? ' · margen real ' + pct(r.margenReal) : ''}`); }
async function anularOT(){ const o = otActual(); if (!o) return; const c = consumoOT(o.id); const conCons = Object.values(c).some(q => q > 1e-9);
  const r = await dialog(`Anular ${o.id}`, `${conCons ? `<div class="note warn" style="margin-bottom:10px">${IC.warn}<div>Tiene materiales entregados. Al anular se <b>devuelven al depósito</b> automáticamente (si algo se arruinó, registrá después una baja).</div></div>` : ''}<label class="f">Motivo *<input class="in" id="ao-m"></label>`, 'Anular OT', () => $('#ao-m').value.trim() || false);
  if (!r) return;
  try { if (conCons) await guardarStockMov({tipo:'devolucion', fecha:hoyISO(), otId:o.id, motivo:'Anulación de OT', lineas:Object.entries(c).filter(([,q]) => q > 1e-9).map(([id, q]) => ({item:'m:' + id, cant:q}))});
    await patchOT(o.id, {estado:'anulada', motivoAnulacion:r}, `Anulada: ${r}`); } catch(e) { toast(e.message); } }
async function eliminarOT(id){ const o = (S.ots || []).find(x => x.id === id); if (!o) return;
  const deps = (S.stockmovs || []).filter(d => d.otId === id).map(d => ({col:'stockmovs', id:d.id, txt:`${SM_TXT[d.tipo]} del ${fDate(d.fecha)}`}));
  if (await eliminarRegistros(`Eliminar ${id}`, {col:'ots', id, txt:`${o.codigo || ''} ${o.descripcion || ''}`}, deps)) cerrarOTDet(); }
async function nuevaOTStock(){
  if (!S.productos.length) { toast('Primero cargá productos en Configuración'); return; }
  const r = await dialog('OT para stock', `<div style="display:flex;flex-direction:column;gap:10px"><label class="f">Producto<select class="in" id="os-p">${S.productos.map(p => `<option value="${p.id}">${esc(p.codigo)} ${esc(p.nombre)}</option>`).join('')}</select></label>
    <div class="grid2"><label class="f">Cantidad<input class="in r" type="number" min="1" step="1" id="os-q" value="1"></label><label class="f">Fecha objetivo<input class="in" type="date" id="os-f"></label></div></div>`, 'Crear OT', () => { const q = parseInt($('#os-q').value, 10); if (!(q > 0)) { toast('Cantidad inválida'); return false; } return {pid:$('#os-p').value, q, f:$('#os-f').value}; });
  if (!r) return; const p = S.productos.find(x => x.id === r.pid); const Pp = P(); const R = reglas();
  const desp = 1 + (+Pp.desperdicioPct || 0) / 100; const horasEst = (+p.horas || 0) * r.q; const gh = (+Pp.horasProductivasMes || 0) ? (+Pp.gastosMensuales || 0) / +Pp.horasProductivasMes : 0;
  const mat = (p.bom || []).reduce((s,b) => s + ((matById(b.materialId) || {}).precio || 0) * (+b.cant || 0), 0) * r.q * desp;
  const id = await siguienteOT();
  await put('ots', id, {numero:id, tipo:'stock', presupuestoId:null, clienteId:null, cliente:'', productoId:p.id, codigo:p.codigo, descripcion:p.nombre, cantidad:r.q, espec:null,
    materiales:(p.bom || []).map(b => ({materialId:b.materialId, requerido:Math.round((+b.cant || 0) * r.q * desp * 100) / 100})),
    etapas:R.etapas.map(e => ({n:e.n, horasEst:Math.round(horasEst * (+e.p || 0)) / 100, horasReales:0, hecha:false})), horasEst, estado:'planificada', prioridad:3, fechaPrometida:r.f,
    costoEst:{mat:Math.round(mat), mo:Math.round(horasEst * (+Pp.tarifaHora || 0)), gf:Math.round(horasEst * gh)}, precio:0, historial:[{fecha:now(), por:S.me, texto:'OT para stock creada'}], creado:now(), creadoPor:S.me});
  toast(`${id} creada`); abrirOT(id);
}

/* ---------- Configuración: reglas a medida y cierre de mes ---------- */
function viewReglas(ro){
  const R = reglas(); const f = (k, l, h) => `<label class="f">${l}${h ? `<span class="h">${h}</span>` : ''}<input class="in r" type="number" step="any" id="rg-${k}" value="${esc(R[k])}" ${ro ? 'disabled' : ''}></label>`;
  return `<div class="card pad"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Reglas para cases a medida ${R.ejemplo ? '<span class="ej">Ejemplo</span>' : ''}</h2></div>
    <p class="small muted" style="margin-top:0">Con las medidas internas (mm) del presupuesto, la app calcula la lista de materiales y las horas. Los materiales se eligen por su <b>rol</b> (Configuración → Materiales). Definí estos valores con el taller.</p>
    <h3 style="margin:10px 0">Paredes y merma</h3><div class="grid3">${f('espesorPanel','Espesor de panel (mm)')}${f('espesorEspuma','Espesor de espuma (mm)')}${f('mermaCorte','Merma de corte de paneles (%)','Adicional al desperdicio general')}</div>
    <h3 style="margin:16px 0 10px">Herrajes</h3><div class="grid4">${f('esquineros','Esquineros')}${f('cierresHasta','Cierres: largo límite (mm)')}${f('cierresChico','Cierres hasta el límite')}${f('cierresGrande','Cierres por encima')}</div>
    <div class="grid4" style="margin-top:10px">${f('manijas','Manijas')}${f('bisagrasHasta','Bisagras: largo límite (mm)')}${f('bisagrasChico','Bisagras hasta el límite')}${f('bisagrasGrande','Bisagras por encima')}</div>
    <div class="grid4" style="margin-top:10px">${f('ruedasPesoKg','Ruedas desde peso (kg)')}${f('ruedas','Cantidad de ruedas')}</div>
    <h3 style="margin:16px 0 10px">Mano de obra</h3><div class="grid3">${f('horasBase','Horas base por case')}${f('horasPorM2','Horas por m² de panel')}</div>
    <h3 style="margin:16px 0 10px">Etapas de producción <span class="small muted" style="font-family:var(--fb);font-weight:500">(% de las horas estimadas)</span></h3>
    <textarea class="in" id="rg-etapas" style="min-height:150px" ${ro ? 'disabled' : ''}>${esc(R.etapas.map(e => `${e.n} | ${e.p}`).join('\n'))}</textarea><p class="small muted">Una por línea: nombre | porcentaje. Deberían sumar 100.</p>
    <h3 style="margin:16px 0 10px">Checklist de control final</h3>
    <textarea class="in" id="rg-check" style="min-height:130px" ${ro ? 'disabled' : ''}>${esc(R.checklist.join('\n'))}</textarea>
    ${ro ? '' : `<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" onclick="guardarReglas()">${IC.check} Guardar reglas</button></div>`}</div>`;
}
async function guardarReglas(){
  const keys = ['espesorPanel','espesorEspuma','mermaCorte','esquineros','cierresHasta','cierresChico','cierresGrande','manijas','bisagrasHasta','bisagrasChico','bisagrasGrande','ruedasPesoKg','ruedas','horasBase','horasPorM2'];
  const d = {}; keys.forEach(k => d[k] = pf($('#rg-' + k).value));
  d.etapas = $('#rg-etapas').value.split('\n').map(l => l.split('|')).filter(x => x[0].trim()).map(([n, p]) => ({n:n.trim(), p:pf(p)}));
  const suma = d.etapas.reduce((s,e) => s + e.p, 0); if (Math.abs(suma - 100) > 0.5) { toast(`Los porcentajes de las etapas suman ${fmtN(suma, 1)}: deberían sumar 100`); return; }
  d.checklist = $('#rg-check').value.split('\n').map(x => x.trim()).filter(Boolean); d.ejemplo = false; d.actualizado = now();
  try { await put('config', 'reglas', d); toast('Reglas guardadas'); } catch(e) {}
}
function viewCierres(){
  const A = libroDiario(); const ms = mesesConDatos(A); const c = MESES_CERRADOS();
  return `<div class="card"><div class="pad" style="border-bottom:1px solid var(--line)"><h2>Cierre de mes</h2><p class="small muted" style="margin:4px 0 0">Un mes cerrado no acepta cargas, cambios ni borrados de caja, compras, stock ni asientos. Cerrá cuando el contador termine de revisar. Cerrar: cualquier socio. Reabrir: solo un administrador.</p></div>
    <table class="t"><tbody>${ms.slice().reverse().map(m => { const cerr = c.includes(m); const R = resultadoPeriodo(A, m + '-01', finMes(m));
      return `<tr><td><b>${nombreMes(m)}</b></td><td class="small muted">Resultado ${gs(R.neto)}</td><td>${cerr ? '<span class="tag" style="background:var(--neutral-soft);color:#55534f">🔒 Cerrado</span>' : '<span class="tag" style="background:var(--ok-soft);color:var(--ok)">Abierto</span>'}</td>
        <td class="r">${!cerr && S.canAdmin && m < mesDe(hoyISO()) ? `<button class="btn sm" onclick="cambiarCierre('${m}',true)">Cerrar mes</button>` : ''}${cerr && S.esAdmin ? `<button class="btn sm ghost" onclick="cambiarCierre('${m}',false)">Reabrir</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}
async function cambiarCierre(m, cerrar){
  if (!(await dialog(cerrar ? `Cerrar ${nombreMes(m)}` : `Reabrir ${nombreMes(m)}`, cerrar ? 'Después no se podrán cargar ni modificar movimientos con fecha de ese mes.' : 'Se podrán volver a cargar y modificar movimientos de ese mes.', cerrar ? 'Cerrar mes' : 'Reabrir'))) return;
  const meses = cerrar ? [...new Set([...MESES_CERRADOS(), m])].sort() : MESES_CERRADOS().filter(x => x !== m);
  try { await put('config', 'cierres', {meses, actualizado:now(), por:S.me}); toast(cerrar ? 'Mes cerrado' : 'Mes reabierto'); } catch(e) {}
}

function otsDePresHTML(p){
  const L = (S.ots || []).filter(o => o.presupuestoId === p.id).sort((a,b) => (a.renglon || 0) - (b.renglon || 0));
  const ap = p.aprobacionCliente;
  return `<div class="card pad"><div class="row" style="justify-content:space-between"><h3>Aprobado por el cliente</h3><span class="small muted">${fDate(p.cerradoAt)}${ap ? ' · ' + esc(ap.medio) + (ap.oc ? ' ' + esc(ap.oc) : '') : ''}${ap && ap.link ? ` · <a href="${esc(ap.link)}" target="_blank" rel="noopener">evidencia ↗</a>` : ''}</span></div>
    <table class="t" style="margin-top:8px;font-size:13.5px"><tbody>${L.map(o => { const c = o.cierre; return `<tr class="click" onclick="closeDetail();go('ot');abrirOT('${esc(o.id)}')"><td><b>${esc(o.id)}</b></td><td>${esc(o.codigo || '')} ${esc(o.descripcion || '')} · ${o.cantidad} u</td><td>${otTag(o.estado)}</td><td class="r small">${c ? 'Margen real ' + pct(c.margenReal || 0) : o.fechaPrometida ? 'Prometida ' + fDate(o.fechaPrometida) : ''}</td></tr>`; }).join('') || '<tr><td class="muted">Las OT fueron eliminadas.</td></tr>'}</tbody></table>
    <div class="small muted" style="margin-top:6px">Margen estimado ${pct(p.margenFinal)}. El costo real sale del cierre de cada OT.</div></div>`;
}

init();
</script>
