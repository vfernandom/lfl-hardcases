<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LFL Hardcase · Presupuestos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f1ee; --panel:#ffffff; --ink:#16181b; --ink2:#3d3f43; --muted:#73716c; --line:#e2e0db; --line2:#d3d0c9;
  --side:#141619; --side-ink:#cbc6bd; --side-hi:#ffffff;
  --accent:#d9480f; --accent-soft:#fdeee6; --accent-ink:#ffffff;
  --ok:#2b8a3e; --ok-soft:#e6f4ea; --warn:#b7791f; --warn-soft:#fdf3e1; --bad:#c92a2a; --bad-soft:#fdeaea; --info:#1c6ed4; --info-soft:#e7f0fc;
  --neutral-soft:#eceae6;
  --r:10px; --shadow:0 1px 2px rgba(20,22,25,.06),0 4px 16px rgba(20,22,25,.05);
  --fh:'Barlow Condensed',system-ui,sans-serif; --fb:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fh);font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px}
h3{font-size:17px}
a{color:var(--accent)}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand-mark{width:36px;height:36px;border-radius:7px;background:linear-gradient(145deg,#2a2d31,#0e0f11);border:2px solid #8f8a82;position:relative;flex:none}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#b9b3a9;top:-4px}
.brand-mark:before{left:-4px}.brand-mark:after{right:-4px}
.brand-mark i{position:absolute;left:8px;right:8px;top:14px;height:4px;border-radius:2px;background:var(--accent)}
.brand b{font-family:var(--fh);font-size:20px;color:#fff;letter-spacing:.04em;display:block;line-height:1}
.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8f8a82}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.navg{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#7d786f;padding:12px 12px 4px;font-weight:700}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:#1f2226;color:#fff}
.nav a.on{background:#25282d;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:#8f8a82;padding:10px 8px;border-top:1px solid #2a2d31}
.side-foot b{color:#cbc6bd;font-weight:600}
.main{min-width:0;padding:28px 34px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top p{margin:4px 0 0;color:var(--muted)}
.bnav{display:none}
.show-m{display:none}

/* components */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:#c03f0c}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#efc4c4}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;line-height:1.6}
.tag .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.ej{background:#fff4d6;color:#8a5a00;border:1px dashed #e0b44c;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
label.f span.h{font-weight:400;color:var(--muted);font-size:12px}
.in{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;background:#fff;min-height:38px;width:100%}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.r{text-align:right}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#faf9f7}
.t .r{text-align:right}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.note{border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:#7a4f0e}
.note.info{background:var(--info-soft);color:#174f96}
.note.bad{background:var(--bad-soft);color:#8f1d1d}
.note.ok{background:var(--ok-soft);color:#1f6430}
.note svg{width:17px;height:17px;flex:none;margin-top:1px}
.banner{position:sticky;top:0;z-index:30;background:#fff4d6;color:#7a4f0e;border-bottom:1px solid #f0d58e;padding:8px 16px;font-size:13.5px;text-align:center}
.seg{display:inline-flex;background:#e9e7e2;border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--ink)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--fh);font-size:34px;font-weight:700;line-height:1.1;margin-top:6px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.dash{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 92px;align-items:center;gap:10px;font-size:13.5px}
.bar .tr{height:14px;background:#f0eeea;border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--ink2);border-radius:0 4px 4px 0;min-width:2px;transition:width .3s}
.bar .fl.acc{background:var(--accent)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.bar:hover .fl{filter:brightness(1.25)}

/* editor */
.ed{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.sum{position:sticky;top:18px}
.sum .ln{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum .ln span:last-child{font-variant-numeric:tabular-nums}
.sum .tot{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-family:var(--fh);font-size:28px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.sum .tot small{font-family:var(--fb);font-size:12.5px;font-weight:600;color:var(--muted)}
.item{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;background:#fcfbfa}
.item-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item-h .code{font-family:var(--fh);font-weight:700;background:var(--ink);color:#fff;border-radius:5px;padding:1px 8px;font-size:15px}
.item-b{padding:12px 14px}
.lines{width:100%;border-collapse:collapse;font-size:13.5px}
.lines td,.lines th{padding:5px 4px}
.lines th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600}
.lines .in{min-height:32px;padding:5px 8px}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:5px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,16,18,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dr-h{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 22px;position:sticky;top:0;z-index:2}
.dr-b{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.dlg-ov{position:fixed;inset:0;background:rgba(15,16,18,.5);z-index:80;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg h3{margin-bottom:8px}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:3px;background:#e4e2dd}
.steps i.on{background:var(--ink2)}
.steps i.cur{background:var(--accent)}
.steps i.lost{background:var(--bad)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 20px;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.tl li:after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line2)}
.tl li:last-child:after{display:none}
.tl time{color:var(--muted);font-size:12px;display:block}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vtabs button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:4px 10px;font-weight:600;cursor:pointer;font-size:13px}
.vtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;z-index:99;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}

/* chat */
.chatwrap{display:grid;grid-template-columns:minmax(0,430px) 1fr;gap:22px;align-items:start}
.phone{background:#0b141a;border-radius:26px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.ph-h{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#e9edef}
.ph-h .av{width:38px;height:38px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--fh);font-weight:700;color:#fff}
.ph-h b{display:block;font-size:15px}.ph-h small{color:#8696a0;font-size:12px}
.chat{background:#efeae2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px;height:560px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;border-radius:14px 14px 0 0}
.msg{max-width:86%;padding:7px 10px 6px;border-radius:9px;font-size:14.5px;line-height:1.38;box-shadow:0 1px .5px rgba(0,0,0,.13);white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.msg.me{background:#d9fdd3;align-self:flex-end;border-top-right-radius:2px}
.msg time{display:block;text-align:right;font-size:10.5px;color:#667781;margin-top:2px}
.msg .calc{font-variant-numeric:tabular-nums;white-space:normal}
.msg .calc div{display:flex;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:95%}
.chips button{background:#fff;border:1px solid #cfd8dc;color:#027eb5;border-radius:18px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.chips button:hover{background:#f0f9ff}
.ph-in{display:flex;gap:8px;padding:8px;background:#f0f2f5;border-radius:0 0 14px 14px}
.ph-in input{flex:1;border:0;border-radius:20px;padding:10px 14px;background:#fff;min-width:0}
.ph-in input:focus{outline:none}
.ph-in button{width:42px;height:42px;border-radius:50%;border:0;background:#00a884;color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.ph-in button svg{width:20px;height:20px}

/* responsive */
.sin-sesion .side,.sin-sesion .bnav{display:none!important}
.sin-sesion .app{grid-template-columns:1fr}
.login{max-width:400px;margin:8vh auto 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.ft td{padding:4px 3px}.ft .in{min-height:34px;padding:5px 7px}
.prueba{background:#fff4d6;color:#8a5a00;border:1px dashed #e0b44c;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:5px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.dash{grid-template-columns:1fr}.ed{grid-template-columns:1fr}.sum{position:static}.chatwrap{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 14px 92px}
  h1{font-size:25px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:27px}
  .bar{grid-template-columns:100px 1fr 74px;font-size:12.5px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--side);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#a7a198;text-decoration:none;font-size:10.5px;font-weight:600;padding:4px 0}
  .bnav a svg{width:21px;height:21px}
  .bnav a.on{color:#fff}
  .bnav a.on svg{color:var(--accent)}
  .hide-m{display:none}
  .show-m{display:block!important}
  .show-m .tag{white-space:normal}
  .listq{max-width:none!important;flex-basis:100%}
  .chat{height:calc(100vh - 400px);height:calc(100dvh - 400px);min-height:340px}
  .phone{border-radius:16px;padding:6px}
  .dr-h,.dr-b{padding-left:14px;padding-right:14px}
  .t th,.t td{padding:9px 6px}
  .t{font-size:14px}
  .t .num b{font-size:13.5px}
}
@media (max-width:420px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
</style>
</head>

<div id="banner"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark"><i></i></div><div><b>LFL HARDCASE</b><small>Presupuestos</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sidefoot">Conectando…</div>
  </aside>
  <main class="main" id="view"></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="layer"></div>

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);

const fmtN = (n, d=0) => { n = +n || 0; const neg = n < 0; n = Math.abs(n); let [i, f] = n.toFixed(d).split('.'); i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg?'-':'') + i + (f ? ',' + f : ''); };

const pct = (x, d=1) => (isFinite(x) ? fmtN(x*100, d) : '—') + '%';
const pf = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };

const sleep = ms => new Promise(r => setTimeout(r, ms));

const IC = {

/* cálculo según propuesta: costo = materiales + MO + desperdicio + gastos + adicionales ; precio = costo / (1 - margen) */
function calc(items, adicionales, P, margenPct, descuentoPct){
  P = P || {};
  let mat = 0, horas = 0;
  const porItem = (items||[]).map(it => {
    const q = +it.cantidad || 0;
    const m = (it.lineas||[]).reduce((s,l) => s + (+l.precio||0)*(+l.cant||0), 0) * q;
    const h = (+it.horas||0) * q;
    mat += m; horas += h;
    return {m, h};
  });
  const mo = horas * (+P.tarifaHora||0);
  const desp = mat * (+P.desperdicioPct||0)/100;
  const gastoHora = (+P.horasProductivasMes||0) > 0 ? (+P.gastosMensuales||0)/(+P.horasProductivasMes) : 0;
  const gastos = horas * gastoHora;
  const adic = (adicionales||[]).reduce((s,a) => s + (+a.monto||0), 0);
  const costo = mat + mo + desp + gastos + adic;
  const m = Math.min(Math.max(+margenPct||0, 0), 95)/100;
  const precioLista = costo/(1-m);
  const red = +P.redondeo || 1;
  const precioRed = costo > 0 ? Math.ceil(precioLista/red)*red : 0;
  const dto = precioRed * (Math.max(+descuentoPct||0,0))/100;
  const precio = precioRed - dto;
  const margenFinal = precio > 0 ? (precio - costo)/precio : 0;
  const iva = (+P.ivaPct||0) > 0 ? precio*(+P.ivaPct)/100 : 0;
  // costo unitario por ítem para mostrar
  const unit = (items||[]).map((it,i) => {
    const q = +it.cantidad||0; if (!q) return 0;
    const mi = porItem[i].m, hi = porItem[i].h;
    return (mi*(1+(+P.desperdicioPct||0)/100) + hi*((+P.tarifaHora||0)+gastoHora))/q;
  });
  return {mat, horas, mo, desp, gastos, gastoHora, adic, costo, precioLista, precioRed, dto, precio, margenFinal, iva, total: precio+iva, unit};
}

async function put(col, id, data){
  try { chequeoCierre(col, data, (S[col] || []).find ? (S[col] || []).find(x => x.id === id) : null); } catch(e) { toast(e.message); throw e; }
  if (col === 'config' && id === 'cierres' && !S.esAdmin && (MESES_CERRADOS().some(m => !(data.meses || []).includes(m)))) { toast('Solo un administrador puede reabrir un mes'); throw new Error('reabrir'); }
  if (S.mode === 'mem') {
    if (col === 'config') { if (id === 'params') S.params = clone(data); else S[id] = clone(data); }
    else { const arr = S[col]; const i = arr.findIndex(x => x.id === id); const v = {id, ...clone(data)}; if (i >= 0) arr[i] = v; else arr.push(v); if (col==='presupuestos') arr.sort((a,b)=>String(b.creado).localeCompare(String(a.creado))); }
    persist(); render(); return;
  }
  if (S.mode === 'supa') {
    const { error } = await S.sb.from('docs').upsert({ col, id, data });
    if (error) { toast(/mes .* cerrado|cerrado/i.test(error.message) ? error.message : /row-level|permission|policy/i.test(error.message) ? 'No tenés permiso para guardar esto (solo socios).' : 'No se pudo guardar: ' + error.message); throw error; }
    aplicarDoc({ col, id, data }); render(); return;
  }
  try { await S.db.doc(col + '/' + id).set(data); }
  catch(e){
    if (e && e.code === 'invalid_argument') { toast('No tenés permiso para guardar esto. Pedile a un socio que te dé acceso de Colaborador o Editor.'); }
    else if (e && e.code === 'quota_exceeded') { toast('La base llegó a su límite de espacio.'); }
    else toast('No se pudo guardar (' + (e && e.code || 'error') + '). Probá de nuevo.');
    throw e;
  }
}
async function del(col, id){
  try { chequeoCierre(col, null, (S[col] || []).find ? (S[col] || []).find(x => x.id === id) : null); } catch(e) { toast(e.message); throw e; }

}
async function nextNumero(){
  const maxOf = list => list.reduce((m,p) => { const n = parseInt(String(p.numero||p.id||'').replace(/\D/g,''),10); return isNaN(n) ? m : Math.max(m,n); }, 0);
  if (S.mode === 'mem') return 'LFL-' + String(maxOf(S.presupuestos)+1).padStart(3,'0');
  if (S.mode === 'supa') { const { data, error } = await S.sb.rpc('siguiente_numero'); if (error) { toast('No se pudo obtener el número: ' + error.message); throw error; } return data; }
  try {
    const lock = S.db.doc('contadores/presupuestos');
    for (let i = 0; i < 6; i++) { const r = await lock.acquire({holder: S.me || uid(), ttlMs: 8000}); if (r.acquired) break; await sleep(900 + Math.random()*600); }
    const snap = await S.db.collection('presupuestos').get();
    return 'LFL-' + String(maxOf(snap.docs.map(d => ({id:d.id, ...d.data()})))+1).padStart(3,'0');
  } catch(e) { return 'LFL-' + String(maxOf(S.presupuestos)+1).padStart(3,'0'); }
}

  if (S.mode === 'login') { $('#view').dataset.route = 'login'; $('#view').innerHTML = viewLogin(); return; }
  $('#nav').innerHTML = ROUTES.filter(r => r.k !== 'menu').map((r, i, L) => `${!i || L[i-1].g !== r.g ? `<div class="navg">${r.g}</div>` : ''}<a href="#${r.k}" class="${S.route===r.k?'on':''}">${IC[r.ic]}${r.n}</a>`).join('');
  $('#bnav').innerHTML = ['tablero','presupuestos','ot','caja','menu'].map(k => ROUTES.find(r => r.k === k)).map(r => `<a href="#${r.k}" class="${S.route===r.k?'on':''}">${IC[r.ic]}${r.nm||r.n}</a>`).join('');
  $('#sidefoot').innerHTML = S.mode === 'loading' ? 'Conectando…' : (S.mode==='mem' ? `Versión de prueba · datos en este dispositivo<br><b>${esc(S.me||'')}</b>` : S.mode==='supa' ? `<b>${esc(nm(S.me))}</b><br>${S.canAdmin ? 'Socio' : 'Equipo comercial'} · <a href="#" onclick="salir();return false" style="color:#cbc6bd">Salir</a>` : `Base compartida<br><b>${S.canAdmin ? 'Rol: socio (aprueba)' : 'Rol: equipo comercial'}</b>`);
  const v = $('#view');
  // preservar foco en editor/chat
  if (S.route === 'nuevo' && v.dataset.route === 'nuevo' && v.dataset.sig === draftSig()) { renderSummary(); renderLayer(); return; }
  if (S.route === 'asistente' && v.dataset.route === 'asistente') { renderLayer(); return; }
  v.dataset.route = S.route;
  if (S.route === 'tablero') v.innerHTML = viewTablero();
  else if (S.route === 'presupuestos') v.innerHTML = viewLista();
  else if (S.route === 'clientes') v.innerHTML = viewClientes();
  else if (S.route === 'caja') v.innerHTML = viewCaja();
  else if (S.route === 'contabilidad') v.innerHTML = viewContabilidad();
  else if (S.route === 'menu') v.innerHTML = viewMenu();
  else if (S.route === 'nuevo') { if (!S.draft) newDraft(); v.innerHTML = viewEditor(); v.dataset.sig = draftSig(); renderSummary(); }
  else if (S.route === 'asistente') { v.innerHTML = viewChat(); chatBoot(); }
  else if (S.route === 'catalogo') v.innerHTML = viewCatalogo();
  else if (S.route === 'ot') v.innerHTML = viewOT();
  else if (S.route === 'stock') v.innerHTML = viewStock();
  renderLayer();
  if (S.otId) dibujarOT();
}
function loadingOr(html){ return S.mode === 'loading' ? `<div class="card empty"><b>Cargando datos…</b>Conectando con la base compartida.</div>` : html; }
function noParamsNote(){
  if (S.params) return S.params.ejemplo ? `<div class="note warn" style="margin-bottom:14px">${IC.warn}<div>Los <b>costos y márgenes son de EJEMPLO</b>. Reemplazalos por los valores reales en <a href="#catalogo">Configuración</a> antes de enviar presupuestos a clientes.</div></div>` : '';

}

/* ============ TABLERO ============ */
function filtrados(){
  const f = S.f; const lim = f.per === 'todo' ? 0 : Date.now() - (+f.per)*864e5;
  return S.presupuestos.filter(p =>
    (!lim || new Date(p.creado).getTime() >= lim) &&
    (!f.prod || (p.productos||[]).includes(f.prod)) &&
    (!f.com || p.creadoPor === f.com) &&
    (!f.est || p.estado === f.est));
}
function viewTablero(){
  const L = filtrados();
  const emit = L.filter(p => EMITIDOS.includes(p.estado));
  const ventas = L.filter(p => p.estado === 'venta');
  const perd = L.filter(p => p.estado === 'perdido');
  const valor = L.filter(p => p.estado !== 'perdido').reduce((s,p) => s + (+p.precioFinal||0), 0);
  const montoV = ventas.reduce((s,p) => s + (+p.precioFinal||0), 0);
  const conv = emit.length ? ventas.length/emit.length : NaN;
  const ticket = ventas.length ? montoV/ventas.length : 0;
  const costoV = ventas.reduce((s,p) => s + (+p.costoEstimado||0), 0);
  const mEst = montoV ? (montoV - costoV)/montoV : NaN;
  const conReal = ventas.filter(p => +p.costoReal > 0);
  const mvR = conReal.reduce((s,p)=>s+(+p.precioFinal||0),0), cR = conReal.reduce((s,p)=>s+(+p.costoReal||0),0);
  const mReal = mvR ? (mvR - cR)/mvR : NaN;
  const tiempos = L.filter(p => p.enviadoAt && p.creado).map(p => new Date(p.enviadoAt) - new Date(p.creado));
  const tResp = tiempos.length ? tiempos.reduce((a,b)=>a+b,0)/tiempos.length : null;

  const byEst = ESTADOS.map(e => ({n:e.n, v:L.filter(p => p.estado === e.k).length, k:e.k}));
  const maxE = Math.max(1, ...byEst.map(x => x.v));
  const prodMap = {};
  L.forEach(p => (p.items || []).forEach(it => { const k = it.codigo || 'A medida'; prodMap[k] = prodMap[k] || {c:0, v:0}; prodMap[k].c += (+it.cantidad||0); if (p.estado === 'venta') prodMap[k].v += (+it.cantidad||0); }));
  const prods = Object.entries(prodMap).sort((a,b) => b[1].c - a[1].c).slice(0, 8);
  const maxP = Math.max(1, ...prods.map(x => x[1].c));
  const motivos = {}; perd.forEach(p => { const k = p.motivoPerdida || 'Sin motivo'; motivos[k] = (motivos[k]||0) + 1; });
  const mot = Object.entries(motivos).sort((a,b)=>b[1]-a[1]); const maxM = Math.max(1, ...mot.map(x=>x[1]));
  const segD = +(P().seguimientoDias || 7);
  const pend = S.presupuestos.filter(p => (p.estado === 'venta' && !tieneFacturaActiva(p)) || p.estado === 'pendiente' || p.estado === 'solicitud' || p.estado === 'elaboracion' || (['enviado','negociacion'].includes(p.estado) && (Date.now() - new Date(p.actualizado||p.creado)) > segD*864e5));
  const comerciales = [...new Set(S.presupuestos.map(p => p.creadoPor).filter(Boolean))];

  return `
  <div class="top"><div><h1>Tablero de gestión</h1><p>Actividad comercial, conversión y rentabilidad de los presupuestos.</p></div>
    <button class="btn pri" onclick="go('nuevo')">${IC.plus} Nuevo presupuesto</button></div>
  ${noParamsNote()}
  <div class="card pad" style="margin-bottom:16px;padding:12px 16px"><div class="row">
    <div class="seg">${[['30','30 días'],['90','90 días'],['365','12 meses'],['todo','Todo']].map(([k,n]) => `<button class="${S.f.per===k?'on':''}" onclick="S.f.per='${k}';render()">${n}</button>`).join('')}</div>
    <select class="in" style="width:auto" onchange="S.f.prod=this.value;render()"><option value="">Todos los productos</option>${[...new Set([...S.productos.map(p=>p.codigo), ...S.presupuestos.flatMap(p=>p.productos||[])])].filter(Boolean).sort().map(c => `<option ${S.f.prod===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
    <select class="in" style="width:auto" onchange="S.f.com=this.value;render()"><option value="">Todos los comerciales</option>${comerciales.map(c => `<option ${S.f.com===c?'selected':''} value="${esc(c)}">${esc(nm(c))}</option>`).join('')}</select>
    <select class="in" style="width:auto" onchange="S.f.est=this.value;render()"><option value="">Todos los estados</option>${ESTADOS.map(e => `<option ${S.f.est===e.k?'selected':''} value="${e.k}">${e.n}</option>`).join('')}</select>
  </div></div>
  ${loadingOr(`
  <div class="kpis">
    <div class="card kpi"><div class="l">Presupuestos</div><div class="v num">${L.length}</div><div class="s">${emit.length} emitidos al cliente</div></div>
    <div class="card kpi"><div class="l">Valor presupuestado</div><div class="v num">${gsM(valor)}</div><div class="s">Excluye perdidos</div></div>
    <div class="card kpi"><div class="l">Ventas confirmadas</div><div class="v num">${ventas.length}</div><div class="s">${gsM(montoV)}</div></div>
    <div class="card kpi"><div class="l">Conversión</div><div class="v num">${isNaN(conv)?'—':pct(conv,0)}</div><div class="s">Ventas ÷ emitidos</div></div>
    <div class="card kpi"><div class="l">Ticket promedio</div><div class="v num">${ventas.length?gsM(ticket):'—'}</div><div class="s">Por venta confirmada</div></div>
    <div class="card kpi"><div class="l">Margen estimado</div><div class="v num">${isNaN(mEst)?'—':pct(mEst)}</div><div class="s">Sobre ventas confirmadas</div></div>
    <div class="card kpi"><div class="l">Margen real</div><div class="v num">${isNaN(mReal)?'—':pct(mReal)}</div><div class="s">${conReal.length} de ${ventas.length} ventas con costo real</div></div>
    <div class="card kpi"><div class="l">Tiempo de respuesta</div><div class="v num">${tResp===null?'—':durTxt(tResp)}</div><div class="s">Promedio de alta → envío</div></div>
  </div>
  <div class="dash">
    <div class="card pad"><h3 style="margin-bottom:14px">Presupuestos por estado</h3>
      <div class="bars">${byEst.map(b => `<div class="bar" title="${esc(b.n)}: ${b.v}"><span>${esc(b.n)}</span><div class="tr"><div class="fl ${b.k==='venta'?'acc':''}" style="width:${b.v/maxE*100}%"></div></div><span class="v">${b.v}</span></div>`).join('')}</div>
    </div>
    <div class="card pad"><h3 style="margin-bottom:4px">Casos que necesitan seguimiento</h3><p class="small muted" style="margin:0 0 10px">Ventas sin facturar, sin aprobar, sin calcular, o enviados sin movimiento hace más de ${segD} días.</p>
      ${pend.length ? `<table class="t"><tbody>${pend.slice(0,8).map(p => `<tr class="click" onclick="openDetail('${esc(p.id)}')"><td><b>${esc(p.numero)}</b><div class="small muted">${esc(p.cliente&&p.cliente.nombre)}</div></td><td>${p.estado === 'venta' ? `<span class="tag" style="background:var(--warn-soft);color:#9a6212"><span class="dot"></span>Venta sin facturar</span>` : estTag(p.estado, p.aprobado)}</td><td class="r small muted">${fDate(p.actualizado||p.creado)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty"><b>Todo al día</b>No hay casos pendientes.</div>`}
    </div>
    <div class="card pad"><h3 style="margin-bottom:4px">Productos cotizados</h3><p class="small muted" style="margin:0 0 12px">Unidades cotizadas · <b style="color:var(--ink)">vendidas</b> a la derecha</p>
      ${prods.length ? `<div class="bars">${prods.map(([k,x]) => `<div class="bar" title="${esc(k)}: ${x.c} cotizadas, ${x.v} vendidas"><span>${esc(k)}</span><div class="tr"><div class="fl" style="width:${x.c/maxP*100}%"></div></div><span class="v">${x.c} · <b>${x.v}</b></span></div>`).join('')}</div>` : `<div class="empty">Sin datos en el período.</div>`}
    </div>
    <div class="card pad"><h3 style="margin-bottom:14px">Motivos de pérdida</h3>
      ${mot.length ? `<div class="bars">${mot.map(([k,v]) => `<div class="bar" title="${esc(k)}: ${v}"><span>${esc(k)}</span><div class="tr"><div class="fl" style="width:${v/maxM*100}%;background:var(--bad)"></div></div><span class="v">${v}</span></div>`).join('')}</div>` : `<div class="empty">Sin casos perdidos en el período.</div>`}
    </div>
  </div>`)}`;
}

function newDraft(from){
  const p = P();

function draftSig(){ const d = S.draft; if (!d) return ''; return d.items.map(i => i.id + ':' + (i.lineas||[]).length).join('|') + '#' + d.adicionales.length + '#' + (S.editId||'') + '#' + S.materiales.length + '#' + S.productos.length + '#' + (d.cliente && d.cliente.clienteId || '') + '#' + (S.params?1:0); }
function matById(id){ return S.materiales.find(m => m.id === id); }
function matByRol(r){ return S.materiales.find(m => m.rol === r); }
function itemDesdeProducto(prod, cant){
  return {id:uid(), tipo:'producto', productoId:prod.id, codigo:prod.codigo, nombre:prod.nombre, medidas:prod.medidas||'', cantidad:cant||1, horas:+prod.horas||0, tasaIva: prod.tasaIva ?? null,
    lineas:(prod.bom||[]).map(b => { const m = matById(b.materialId) || {}; return {materialId:b.materialId, nombre:m.nombre||b.nombre||'(material eliminado)', unidad:m.unidad||'', precio:+m.precio||0, cant:+b.cant||0}; })};
}
function lineasGeoViejo(l, a, h){
  l=+l||0; a=+a||0; h=+h||0;
  const area = 2*(l*a + l*h + a*h)/1e6, arist = 4*(l + a + h)/1000; // medidas en milímetros
  const q = {placa: area, espuma: area, perfil: arist, ...GEO_FIJAS};
  const out = [];
  Object.entries(q).forEach(([rol, cant]) => { const m = matByRol(rol); if (m) out.push({materialId:m.id, nombre:m.nombre, unidad:m.unidad, precio:+m.precio||0, cant:Math.round(cant*100)/100}); });
  return out;
}
function itemMedida(l, a, h, cant, horas){
  const g = (l&&a&&h) ? geoCase(l, a, h, 0) : null;
  return {id:uid(), tipo:'medida', codigo:'A medida', nombre:'Case a medida', medidas: g ? `${l} × ${a} × ${h} mm` : '', dims:{l,a,h,u:'mm'}, espec:{tipoCase:'transporte', altoTapa:'', peso:''}, cantidad:cant||1, horas: +horas || (g ? g.horas : 0), lineas: g ? g.lineas : [], geo:true};
}

function buildVersion(d, n){

let saving = false;
async function saveDraft(estado, origen){
  if (saving) return; saving = true;
  try {
    const d = S.draft;
    if (S.editId) {
      const p = S.presupuestos.find(x => x.id === S.editId); if (!p) throw new Error('no existe');
      const ver = buildVersion(d, (p.versiones||[]).length + 1);
      const doc = clone(p); delete doc.id;
      doc.versiones = [...(p.versiones||[]), ver];
      Object.assign(doc, resumenCampos(ver), {estado:'pendiente', aprobado:null, actualizado:now()});
      doc.historial = [...(p.historial||[]), {fecha:now(), por:S.me, texto:`Nueva versión v${ver.v}${d.motivoCambio ? ' — ' + d.motivoCambio : ''}. Pasa a pendiente de aprobación.`}];
      await put('presupuestos', p.id, doc);
      toast(`${p.numero} v${ver.v} guardada`);
      S.editId = null; S.draft = null; newDraft(); go('presupuestos'); openDetail(p.id);
    } else {
      const cid = await asegurarCliente(d.cliente);
      if (cid) d.cliente.clienteId = cid;
      const numero = await nextNumero();
      const ver = buildVersion(d, 1);
      const doc = {numero, cliente:clone(d.cliente), estado, aprobado:null, versiones:[ver], creado:now(), creadoPor:S.me, actualizado:now(), origen: origen || 'formulario',
        historial:[{fecha:now(), por:S.me, texto: `Creado (${origen==='asistente'?'asistente WhatsApp':'formulario'}) · ${EST[estado].n}`}], ...resumenCampos(ver)};
      await put('presupuestos', numero, doc);
      toast(`${numero} creado`);
      S.draft = null; newDraft();
      if (origen !== 'asistente') { go('presupuestos'); openDetail(numero); }
      return numero;
    }
  } catch(e) { console.error(e); } finally { saving = false; }
}

function textoCliente(p, ver){
  const pr = ver.params || {}, c = ver.calc;
  const lin = ver.items.map(i => `• ${i.cantidad} × ${i.codigo === 'A medida' ? 'Case a medida' : i.codigo + ' – ' + i.nombre}${i.medidas ? ' (' + i.medidas + ')' : ''}`);
  ver.adicionales.forEach(a => lin.push(`• ${a.concepto || 'Adicional'}`));
  return [`*LFL HARDCASE — Presupuesto ${p.numero}${ver.v > 1 ? ' (v' + ver.v + ')' : ''}*`,
    `Cliente: ${p.cliente.nombre}${p.cliente.empresa ? ' — ' + p.cliente.empresa : ''}`,
    `Fecha: ${fDate(ver.fecha)} · Validez: ${pr.validezDias ?? '—'} días`, '', ...lin, '',
    (+pr.ivaPct) ? `Subtotal: ${gs(c.precio)}\nIVA ${fmtN(pr.ivaPct,1)}%: ${gs(c.iva)}\n*Total: ${gs(c.precio + c.iva)}*` : `*Total: ${gs(c.precio)}*`,
    `Anticipo: ${pr.anticipoPct ?? '—'}% · Entrega: ${pr.plazoEntrega || 'a confirmar'}`,
    ver.notas ? `\nNotas: ${ver.notas}` : ''].join('\n').trim();
}

async function patchPres(id, changes, texto){
  const p = S.presupuestos.find(x => x.id === id); if (!p) return;
  const doc = clone(p); delete doc.id;
  Object.assign(doc, changes, {actualizado: now()});
  if (texto) doc.historial = [...(p.historial||[]), {fecha:now(), por:S.me, texto}];
  await put('presupuestos', id, doc);
}
async function aprobar(){
  const p = S.presupuestos.find(x => x.id === S.detailId); if (!p || !S.canAdmin) return;
  const v = p.versiones.length, ver = p.versiones[v-1], Pp = P();
  const exc = [];
  if (Pp.margenMinimo != null && ver.calc.margenFinal*100 < +Pp.margenMinimo) exc.push(`margen ${pct(ver.calc.margenFinal)} bajo el mínimo`);
  if (Pp.descuentoMax != null && ver.descuento > +Pp.descuentoMax) exc.push(`descuento ${ver.descuento}% sobre el máximo`);
  const ok = await dialog(`Aprobar ${p.numero} v${v}`, `Precio ${gs(ver.calc.precio)} · margen final ${pct(ver.calc.margenFinal)}.${exc.length ? '<div class="note bad" style="margin-top:10px">' + IC.warn + '<div><b>Excepción:</b> ' + exc.join('; ') + '. Al aprobar, la autorizás.</div></div>' : ''}<p class="small muted">Aprobar es la revisión interna; no es la venta.</p>`, 'Aprobar');
  if (!ok) return;
  await patchPres(p.id, {aprobado:{por:S.me, fecha:now(), version:v, excepcion: exc.join('; ') || null}}, `Aprobada v${v}${exc.length ? ' (excepción: ' + exc.join('; ') + ')' : ''}`);
  toast('Aprobado');
}
async function setEstado(k){
  const p = S.presupuestos.find(x => x.id === S.detailId); if (!p) return;

  await patchPres(p.id, ch, `Estado → ${EST[k].n}`);
}
async function confirmarVenta(){

  const r = await dialog('Aprobado por el cliente', `<p style="margin-top:0">${esc(p.numero)} por <b>${gs(p.precioFinal)}</b>. Se generan las órdenes de trabajo (una por renglón).</p>
    <div class="grid2"><label class="f">Cómo aprobó *<select class="in" id="ac-m"><option value="">Elegir…</option><option>Orden de compra</option><option>Email</option><option>WhatsApp</option><option>Firma del presupuesto</option><option>Verbal / presencial</option></select></label>

async function generarOTsPres(fecha){

async function guardarCostoReal(){ const v = pf($('#costoReal').value); const p = S.presupuestos.find(x => x.id === S.detailId); if (!p) return; await patchPres(p.id, {costoReal:v}, `Costo real registrado: ${gs(v)}`); toast('Costo real guardado'); }
function editPres(id){
  const p = S.presupuestos.find(x => x.id === id); if (!p) return;
  const last = (p.versiones||[])[p.versiones.length-1] || {};
  S.editId = id;
  S.draft = {cliente:clone(p.cliente), items:clone(last.items||[]).map(i => { const it = {...i, id:i.id||uid()};
      if (it.tipo === 'medida' && it.dims && it.dims.u !== 'mm' && it.dims.l) { ['l','a','h'].forEach(k => it.dims[k] = Math.round(+it.dims[k] * 10)); it.dims.u = 'mm'; it.medidas = `${it.dims.l} × ${it.dims.a} × ${it.dims.h} mm`; }
      return it; }), adicionales:clone(last.adicionales||[]), margen:last.margen ?? P().margenObjetivo ?? 35, descuento:last.descuento||0, notas:last.notas||'', motivoCambio:''};
  // precios de materiales actualizados al catálogo vigente
  S.draft.items.forEach(it => (it.lineas||[]).forEach(l => { const m = matById(l.materialId); if (m) { l.precio = +m.precio||0; l.nombre = m.nombre; l.unidad = m.unidad; } }));
  S.detailId = null; $('#view').dataset.sig = ''; go('nuevo');
}
function dialog(title, body, okTxt, collect){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'dlg-ov';
    w.innerHTML = `<div class="dlg"><h3>${esc(title)}</h3><div>${body}</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-c>Cancelar</button><button class="btn pri" data-o>${esc(okTxt)}</button></div></div>`;
    document.body.appendChild(w);
    w.querySelector('[data-c]').onclick = () => { w.remove(); res(false); };
    w.querySelector('[data-o]').onclick = () => { const v = collect ? collect() : true; if (v === false) return; w.remove(); res(v); };

/* ============ ASISTENTE (simulación WhatsApp) ============ */
const CH = {msgs:[], step:'inicio', ctx:{}, chips:[], booted:false};
function viewChat(){

}
function chatBoot(){ if (!CH.booted) { CH.booted = true; chatInicio(); } else drawChat(); }
function chatReset(){ CH.msgs = []; CH.ctx = {}; chatInicio(); }
function bot(t, html){ CH.msgs.push({who:'bot', t, html, at:hhmm()}); }
function me(t){ CH.msgs.push({who:'me', t, at:hhmm()}); }
function chips(arr){ CH.chips = arr; }
function drawChat(){
  const el = $('#chat'); if (!el) return;
  el.innerHTML = CH.msgs.map(m => `<div class="msg ${m.who}">${m.html ? m.html : esc(m.t)}<time>${m.at}</time></div>`).join('') +
    (CH.chips.length ? `<div class="chips">${CH.chips.map((c, i) => `<button onclick="chatChip(${i})">${esc(c.l)}</button>`).join('')}</div>` : '');

function chatInicio(){

function chatChip(i){ const c = CH.chips[i]; if (!c) return; me(c.l); CH.chips = []; chatStep(c.v, c.l); }
function chatSend(){ const i = $('#chatIn'); const t = i.value.trim(); if (!t) return; i.value = ''; me(t); CH.chips = []; chatStep(null, t); }
async function chatStep(v, t){
  const c = CH.ctx, s = CH.step, Pp = P();

  const m = String(t||'').match(/LFL-?\s*(\d+)/i);
  if (s === 'inicio' && !v && m) v = 'consultar';
  if (s === 'inicio') {
    if (v === 'nuevo' || /nuevo|presupuest|cotiz/i.test(t) && v !== 'consultar' && v !== 'pendientes') {
      if (!S.params) { bot('Todavía no hay parámetros de costo cargados en el sistema. Pedile a un socio que los complete en Catálogo y costos.'); chips([{l:'Volver al inicio', v:'reset'}]); CH.step='fin'; }
      else ask('cliente', 'Perfecto. ¿Cuál es el nombre del cliente?');
    } else if (v === 'consultar') {
      if (m) return consultar(m[1]);
      ask('consulta', 'Pasame el número del presupuesto (ej. LFL-003).');
    } else if (v === 'pendientes') {
      const pend = S.presupuestos.filter(p => ABIERTOS.includes(p.estado));
      if (!pend.length) bot('No hay presupuestos abiertos. 🎉');
      else bot(pend.slice(0, 8).map(p => `${p.numero} · ${p.cliente.nombre} · ${EST[p.estado].n}${p.precioFinal ? ' · ' + gs(p.precioFinal) : ''}`).join('\n') + (pend.length > 8 ? `\n…y ${pend.length - 8} más` : ''));
      chips([{l:'Nuevo presupuesto', v:'nuevo'}, {l:'Consultar un presupuesto', v:'consultar'}]);
    } else { bot('Puedo ayudarte a crear un presupuesto nuevo o consultar uno existente.'); chips([{l:'Nuevo presupuesto', v:'nuevo'}, {l:'Consultar un presupuesto', v:'consultar'}, {l:'Ver pendientes', v:'pendientes'}]); }
    return drawChat();
  }
  if (v === 'reset') { chatInicio(); return; }
  if (s === 'consulta') { if (m || /^\d+$/.test(t)) return consultar((m && m[1]) || t); ask('consulta', 'No reconocí el número. Escribilo como LFL-003.'); return drawChat(); }
  if (s === 'cliente') { if (t.length < 2) { ask('cliente', '¿Nombre del cliente?'); return drawChat(); }
    const encontrados = buscarClientes(t, 5);
    if (encontrados.length) { c.nombreTipeado = t; ask('cliElegir', `Encontré ${encontrados.length === 1 ? 'este cliente agendado' : 'estos clientes agendados'}. ¿Es alguno?`, [...encontrados.map(x => ({l: x.nombre + (x.empresa ? ' · ' + x.empresa : ''), v: 'cli:' + x.id})), {l: 'No, es nuevo', v: 'nuevo'}]); return drawChat(); }
    c.cliente = {nombre:t, telefono:'', empresa:'', email:''}; ask('tel', `¿Número de WhatsApp de ${t}? Con código de país (ej. 595981…).`, [{l:'Omitir', v:'omitir'}]); return drawChat(); }
  if (s === 'cliElegir') {
    if (v && v.startsWith('cli:')) { const x = S.clientes.find(k => 'cli:' + k.id === v);
      if (x) { c.cliente = {clienteId: x.id, nombre: x.nombre || '', empresa: x.empresa || '', telefono: x.telefono || '', email: x.email || '', tipoDoc: x.tipoDoc || 'ruc', documento: x.documento || '', razonSocial: x.razonSocial || ''};
        c.items = []; c.adicionales = []; bot(`Listo, uso los datos de ${x.nombre}${x.telefono ? ' (' + x.telefono + ')' : ''}.`);
        if (!x.telefono) { ask('tel', `¿Número de WhatsApp de ${x.nombre}?`, [{l:'Omitir', v:'omitir'}]); return drawChat(); }
        return askProducto(); } }
    c.cliente = {nombre: c.nombreTipeado, telefono:'', empresa:'', email:''};
    ask('tel', `Nuevo cliente: ${c.nombreTipeado}. ¿Número de WhatsApp? Con código de país (ej. 595981…).`, [{l:'Omitir', v:'omitir'}]); return drawChat();
  }
  if (s === 'tel') { if (v !== 'omitir') c.cliente.telefono = t.replace(/[^\d+]/g, ''); c.items = []; c.adicionales = []; return askProducto(); }
  if (s === 'producto') {
    if (v === 'medida' || /medida/i.test(t||'')) { c.cur = {tipo:'medida'}; ask('dims', 'Indicame las medidas interiores en milímetros: largo × ancho × alto (ej. 1100x400x150).'); return drawChat(); }
    const pr = S.productos.find(p => p.id === v) || S.productos.find(p => String(p.codigo).toLowerCase() === String(t).trim().toLowerCase());
    if (!pr) { ask('producto', 'No encontré ese producto. Elegí uno de la lista o “A medida”.', prodChips()); return drawChat(); }
    c.cur = {tipo:'producto', prod:pr};
    if (!(+pr.horas)) { ask('horas', `${pr.codigo} no tiene tiempo de fabricación cargado. ¿Cuántas horas estimás por unidad?`); return drawChat(); }
    ask('cant', `${pr.codigo} – ${pr.nombre}. ¿Cuántas unidades?`, [{l:'1',v:'1'},{l:'2',v:'2'},{l:'5',v:'5'},{l:'10',v:'10'}]); return drawChat();
  }
  if (s === 'dims') {
    const n = String(t).replace(/,/g, '.').match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/);
    if (!n) { ask('dims', 'No pude leer las medidas. Escribilas en mm así: 1100x400x150'); return drawChat(); }
    c.cur.dims = {l:+n[1], a:+n[2], h:+n[3]};
    if (!S.materiales.some(m => ['placa','perfil'].includes(m.rol))) bot('⚠️ El catálogo no tiene materiales con rol placa/perfil; la estimación de materiales va a quedar incompleta.');
    ask('horas', `Medidas ${n[1]} × ${n[2]} × ${n[3]} mm. ¿Cuántas horas de fabricación estimás por unidad?`); return drawChat();
  }
  if (s === 'horas') { const h = pf(t); if (!(h > 0)) { ask('horas', 'Necesito un número de horas mayor a 0 (ej. 6 o 7,5).'); return drawChat(); } c.cur.horas = h; ask('cant', '¿Cuántas unidades?', [{l:'1',v:'1'},{l:'2',v:'2'},{l:'5',v:'5'},{l:'10',v:'10'}]); return drawChat(); }
  if (s === 'cant') {

    ask('otroProd', `Agregado: ${q} × ${it.codigo === 'A medida' ? 'case a medida ' + it.medidas : it.codigo}. ¿Agregás otro producto?`, [{l:'Sí, otro producto', v:'si'}, {l:'No, seguir', v:'no'}]); return drawChat();
  }
  if (s === 'otroProd') { if (v === 'si' || /^s/i.test(t)) return askProducto(); return askAdic(); }
  if (s === 'adic') {
    if (v === 'no' || /^no/i.test(t)) return askMargen();
    c.adicCur = v || t; ask('adicMonto', `¿Monto de ${c.adicCur.toLowerCase()} en guaraníes?`); return drawChat();
  }
  if (s === 'adicMonto') { const n = pf(String(t).replace(/\./g, '').replace(/[^\d,]/g, '')); if (!(n >= 0) || t.trim() === '') { ask('adicMonto', 'Escribí solo el monto, ej. 150000'); return drawChat(); } c.adicionales.push({concepto:c.adicCur, monto:n}); return askAdic(true); }
  if (s === 'margen') {
    let mg = v === 'obj' ? +Pp.margenObjetivo : pf(String(t).replace('%', ''));
    if (!(mg >= 0 && mg < 95)) { ask('margen', 'Indicame el margen en %, entre 0 y 94.'); return drawChat(); }
    c.margen = mg; return resumen();
  }
  if (s === 'confirmar') {
    if (v === 'crear') {
      S.draft = {cliente:c.cliente, items:c.items, adicionales:c.adicionales, margen:c.margen, descuento:0, notas:'', motivoCambio:''}; S.editId = null;
      bot('Guardando…'); drawChat();
      const num = await saveDraft('pendiente', 'asistente');
      CH.msgs.pop();
      if (num) bot(`✅ Listo: ${num} quedó pendiente de aprobación.\nUn socio debe revisarlo antes de enviarlo al cliente. Podés consultar su estado escribiendo el número.`);
      else bot('No pude guardar el presupuesto. Revisá tu acceso o intentá de nuevo.');

/* ============ SUPABASE: sesión, datos y tiempo real ============ */
function aplicarDoc(row){
  const {col, id, data} = row;
  if (col === 'config') { if (id === 'params') S.params = data; else if (['reglas','cierres'].includes(id)) S[id] = data; return; }
  const arr = S[col]; if (!arr) return;
  const v = {id, ...data}; const i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr[i] = v; else arr.push(v);
  if (col === 'presupuestos') arr.sort((a,b) => String(b.creado).localeCompare(String(a.creado)));
  if (col === 'productos') arr.sort((a,b) => String(a.codigo).localeCompare(String(b.codigo)));
}
function quitarDoc({col, id}){ if (col === 'config') { if (id === 'params') S.params = null; else if (['reglas','cierres'].includes(id)) S[id] = null; return; } if (S[col]) S[col] = S[col].filter(x => x.id !== id); }
function aplicarPerfiles(){
  S.names = {}; S.perfiles.forEach(p => S.names[p.user_id] = p.nombre || 'Usuario');
  const yo = S.perfiles.find(p => p.user_id === S.me); S.canAdmin = !!(yo && yo.rol === 'socio');
  S.esAdmin = !!(yo && yo.admin); S.apruebaOP = !!(yo && yo.aprueba_op && yo.rol === 'socio');
}
async function initSupa(){
  if (!window.supabase || !window.supabase.createClient) { S.mode = 'error'; banner('No se pudo cargar la librería de Supabase. Revisá tu conexión y recargá.'); return; }
  S.sb = window.supabase.createClient(SB_URL, SB_KEY);
  S.sb.auth.onAuthStateChange(async (ev, ses) => {
    if (ev === 'PASSWORD_RECOVERY') { setTimeout(cambiarClave, 300); }
    if (ev === 'SIGNED_OUT') { S.mode = 'login'; S.me = null; render(); }
  });
  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) { S.mode = 'login'; render(); return; }
  await iniciarSesion(session);
}
async function cargarDocs(){
  const out = []; for (let i = 0; i < 100; i++) {
    const r = await S.sb.from('docs').select('col,id,data').order('col').order('id').range(i * 1000, i * 1000 + 999);
    if (r.error) return {error:r.error}; out.push(...r.data); if (r.data.length < 1000) break; }
  return {data:out};
}
async function iniciarSesion(session){
  S.me = session.user.id; S.email = session.user.email; S.mode = 'supa';
  banner(''); render();
  const timer = setTimeout(() => banner('La base tarda en responder. Revisá la conexión.'), 10000);
  const [d, pf, fc] = await Promise.all([
    cargarDocs(),
    S.sb.from('perfiles').select('*'),
    S.sb.from('facturas').select('*').order('created_at', {ascending: true}),
  ]);
  clearTimeout(timer);
  if (d.error) { banner('No se pudieron leer los datos: ' + esc(d.error.message)); return; }
  S.params = null; S.materiales = []; S.productos = []; S.presupuestos = []; S.clientes = []; S.plan = []; S.fondos = []; S.proveedores = []; S.compras = []; S.ordenes = []; S.movimientos = []; S.asientos = []; S.stockajustes = []; S.ots = []; S.stockmovs = []; S.reglas = null; S.cierres = null;
  d.data.forEach(aplicarDoc);
  S.perfiles = pf.data || []; aplicarPerfiles();
  S.facturas = fc.data || [];
  banner(''); render();
  if (!S.canal) S.canal = S.sb.channel('lfl-cambios')
    .on('postgres_changes', {event:'*', schema:'public', table:'docs'}, ch => { if (ch.eventType === 'DELETE') quitarDoc(ch.old); else aplicarDoc(ch.new); render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'facturas'}, ch => { if (ch.eventType === 'DELETE') { S.facturas = S.facturas.filter(f => f.id !== (ch.old || {}).id); render(); return; } const n = ch.new; const i = S.facturas.findIndex(f => f.id === n.id); if (i >= 0) S.facturas[i] = n; else S.facturas.push(n); render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'perfiles'}, ch => { const n = ch.new; const i = S.perfiles.findIndex(x => x.user_id === n.user_id); if (i >= 0) S.perfiles[i] = n; else S.perfiles.push(n); aplicarPerfiles(); render(); })
    .subscribe();
}

function lineasFactura(p){
  const vers = p.versiones || []; const ver = vers[vers.length-1];
  const ivaDef = P().ivaDefecto ?? 10;
  const ivaPct = +(ver.params && ver.params.ivaPct) || 0;
  const total = Math.round((+ver.calc.precio || 0) + (ivaPct ? (+ver.calc.iva || 0) : 0));
  const cc = calc(ver.items, [], ver.params, 0, 0);
  const parts = ver.items.map((it, i) => {
    const prod = S.productos.find(x => x.id === it.productoId);
    const tasa = it.tasaIva ?? (prod && prod.tasaIva) ?? ivaDef;
    return {descripcion: (it.codigo === 'A medida' ? 'Case a medida' : it.codigo + ' – ' + it.nombre) + (it.medidas ? ' (' + it.medidas + ')' : ''), cantidad: +it.cantidad || 1, peso: (cc.unit[i]||0) * (+it.cantidad||0), tasa_iva: +tasa};
  });
  (ver.adicionales || []).forEach(a => parts.push({descripcion: a.concepto || 'Adicional', cantidad: 1, peso: +a.monto || 0, tasa_iva: +ivaDef}));
  const suma = parts.reduce((s,x) => s + x.peso, 0);
  let acc = 0; parts.forEach(x => { x.importe = suma > 0 ? Math.round(total * x.peso / suma) : Math.round(total / parts.length); acc += x.importe; });
  if (parts.length) { const big = parts.reduce((b,x) => x.importe > b.importe ? x : b, parts[0]); big.importe += total - acc; }
  return {lineas: parts.map(({peso, ...r}) => r), total, ivaPct};
}

  FX = {manual: modoFactura() === 'manual', pid, total, ivaPct, receptor:{document_type: c.tipoDoc || 'ruc', document_number: c.documento || '', name: c.razonSocial || c.empresa || c.nombre || '', email: c.email || ''}, condicion:'contado', plazo_dias:30, items: lineas};

}

function avisosFactura(suma){
  const out = [];
  if (FX.ivaPct === 0) out.push(`<div class="note warn" style="font-size:13px">${IC.warn}<div>El presupuesto no tenía IVA configurado: el precio se factura <b>como IVA incluido</b>. Confirmalo con el contador ${FX.manual ? 'antes de emitir' : 'antes de producción'}.</div></div>`);
  if (Math.round(suma) !== Math.round(FX.total)) out.push(`<div class="note warn" style="font-size:13px">${IC.warn}<div>El total (${gs(suma)}) no coincide con el del presupuesto (${gs(FX.total)}).</div></div>`);
  return out.join('');
}

});
async function llamarSifen(body){
  const { data, error } = await S.sb.functions.invoke('sifen', { body });
  if (!error) return data;
  let msg = error.message;

function buscarClientes(q, n = 8){
  q = normTxt(q); if (!q) return [];

// Agenda o actualiza el cliente al guardar un presupuesto. Devuelve el id o null si no se pudo.
async function asegurarCliente(cl){
  if (!cl || !String(cl.nombre || '').trim()) return null;
  const datos = {}; CLI_CAMPOS.forEach(k => { if (cl[k] != null && String(cl[k]).trim() !== '') datos[k] = String(cl[k]).trim(); });
  let c = cl.clienteId && S.clientes.find(x => x.id === cl.clienteId);
  const explicito = !!c; // elegido del buscador: se actualizan sus datos; coincidencia automática: solo se completan vacíos
  if (!c) {
    const d = soloDig(cl.documento), t = soloDig(cl.telefono);
    c = S.clientes.find(x => (d.length >= 5 && soloDig(x.documento) === d) || (t.length >= 7 && soloDig(x.telefono) === t));
  }
  try {
    if (c) {
      const merged = {...c}; delete merged.id; let cambio = false;
      Object.entries(datos).forEach(([k,v]) => { if (merged[k] !== v && (explicito || !String(merged[k] || '').trim())) { merged[k] = v; cambio = true; } });
      if (cambio) { merged.actualizado = now(); await put('clientes', c.id, merged); }
      return c.id;
    }
    const id = 'c-' + uid();
    await put('clientes', id, {...datos, tipoDoc: datos.tipoDoc || 'ruc', creado: now(), creadoPor: S.me});
    return id;
  } catch(e) { console.warn('No se pudo agendar el cliente', e); return null; }
}

function tir(flujos){ // flujos mensuales, devuelve tasa mensual o null

  return 'OP-' + String(n + 1).padStart(4, '0');
}
async function decidirOP(id, estado){

  const txt = {aprobada:'Aprobar', rechazada:'Rechazar', anulada:'Anular'}[estado];
  const r = await dialog(`${txt} ${id}`, `<p><b>${esc(o.beneficiario)}</b> · ${gs(o.monto)}<br><span class="small muted">${esc(o.concepto)}</span></p>${estado !== 'aprobada' ? '<label class="f">Motivo<input class="in" id="op-mo"></label>' : ''}`, txt, () => estado !== 'aprobada' ? ($('#op-mo').value.trim() || 'Sin motivo') : true);

function balanceA(A, hasta){

  return {g, res, activo, pasivo, patrimonio, sum};
}

function flujosSocios(A){ // por mes: aportes (-), retiros (+); valor final = patrimonio
  const ms = mesesConDatos(A); if (!ms.length) return {ms, f:[]};

  const B = balanceA(A, finMes(ms[ms.length - 1])); f[f.length - 1] += B.patrimonio + 0; // valor terminal
  return {ms, f, patrimonio:B.patrimonio};

/* ============ ELIMINAR REGISTROS (solo administradores) ============ */
const BTN_DEL = (fn, txt = 'Eliminar') => S.esAdmin ? `<button class="btn sm ghost" style="color:var(--bad)" onclick="${fn}">🗑 ${txt}</button>` : '';
const ETQ = {presupuestos:'Presupuesto', clientes:'Cliente', movimientos:'Movimiento de caja', ordenes:'Orden de pago', compras:'Compra', proveedores:'Proveedor', asientos:'Asiento manual', stockajustes:'Ajuste de stock', ots:'Orden de trabajo', stockmovs:'Movimiento de stock', fondos:'Cuenta de dinero', facturas:'Factura SIFEN'};
const ORDEN_DEL = ['stockmovs','ots','movimientos','ordenes','compras','facturas','stockajustes','asientos','presupuestos','proveedores','clientes','fondos'];
const pagosDeOP = id => (S.movimientos || []).filter(m => m.tipo === 'egreso' && m.opId === id);
const opsDeCompra = id => (S.ordenes || []).filter(o => o.destino && o.destino.compraId === id);
function depsPresupuesto(p){ return [
  ...(S.movimientos || []).filter(m => m.presupuestoId === p.id).map(m => ({col:'movimientos', id:m.id, txt:`Cobro ${gs(m.monto)} del ${fDate(m.fecha)}`})),
  ...(S.facturas || []).filter(f => f.presupuesto_id === p.id).map(f => ({col:'facturas', id:f.id, txt:`Factura SIFEN ${f.numero || ''} (${f.estado})`})),
  ...(S.ots || []).filter(o => o.presupuestoId === p.id).flatMap(o => [{col:'ots', id:o.id, txt:`${o.id} · ${o.descripcion || ''}`}, ...(S.stockmovs || []).filter(d => d.otId === o.id).map(d => ({col:'stockmovs', id:d.id, txt:`${SM_TXT[d.tipo]} del ${fDate(d.fecha)}`}))])]; }
function depsOP(o){ return pagosDeOP(o.id).map(m => ({col:'movimientos', id:m.id, txt:`Pago ${gs(m.monto)} del ${fDate(m.fecha)}`})); }
function depsCompra(c){ return opsDeCompra(c.id).flatMap(o => [{col:'ordenes', id:o.id, txt:`${o.id} · ${gs(o.monto)} (${o.estado})`}, ...depsOP(o)]); }
async function eliminarRegistros(titulo, principal, deps, nota){
  if (!S.esAdmin) { toast('Solo un administrador puede eliminar registros'); return false; }
  const todos = [principal, ...deps];
  const ok = await dialog(titulo, `<p style="margin-top:0">Se va a eliminar <b>definitivamente</b>:</p>
    <ul class="small" style="margin:0 0 10px;padding-left:18px">${todos.map(x => `<li>${esc(ETQ[x.col] || x.col)}: ${esc(x.txt)}</li>`).join('')}</ul>
    ${deps.length ? `<div class="note warn" style="font-size:13px">${IC.warn}<div>Incluye ${deps.length} registro${deps.length > 1 ? 's' : ''} relacionado${deps.length > 1 ? 's' : ''}, para que no queden datos colgados ni la contabilidad descuadrada.</div></div>` : ''}
    ${nota ? `<div class="note info" style="font-size:13px;margin-top:8px">${IC.info}<div>${nota}</div></div>` : ''}
    <label class="row small" style="margin-top:12px"><input type="checkbox" id="delOk"> Entiendo que no se puede deshacer</label>`, 'Eliminar', () => { if (!$('#delOk').checked) { toast('Marcá la confirmación'); return false; } return true; });
  if (!ok) return false;
  const ord = todos.slice().sort((a,b) => ORDEN_DEL.indexOf(a.col) - ORDEN_DEL.indexOf(b.col));
  try { for (const x of ord) await borrar(x.col, x.id); } catch(e) { toast('No se pudo eliminar todo: ' + (e.message || e)); return false; }
  toast(`Eliminado${todos.length > 1 ? ' (' + todos.length + ' registros)' : ''}`); return true;
}
async function borrar(col, id){
  if (col === 'facturas') {
    if (S.mode === 'supa') { const {error} = await S.sb.from('facturas').delete().eq('id', id); if (error) throw error; }
    S.facturas = (S.facturas || []).filter(f => f.id !== id); render(); return;
  }
  const m = col === 'movimientos' ? (S.movimientos || []).find(x => x.id === id) : null;
  await del(col, id);
  if (m && m.tipo === 'egreso') { const o = (S.ordenes || []).find(x => x.id === m.opId && x.pagoMovId === id);
    if (o) { if (S.mode === 'supa') { o.estado = 'aprobada'; delete o.pagoMovId; render(); } // la base ya la revirtió
      else { const d = {...o}; delete d.id; delete d.pagoMovId; d.estado = 'aprobada'; await put('ordenes', o.id, d); } } }
}
async function eliminarPresupuesto(id){ const p = S.presupuestos.find(x => x.id === id); if (!p) return;
  const sifen = (S.facturas || []).some(f => f.presupuesto_id === id && ['approved','approved_obs','signed'].includes(f.estado));
  const fm = (p.facturasManual || []).filter(f => f.estado === 'emitida');
  if (await eliminarRegistros(`Eliminar ${p.numero}`, {col:'presupuestos', id, txt:`${p.numero} · ${(p.cliente || {}).nombre || ''}${fm.length ? ' (con factura registrada N° ' + fm.map(f => f.numero).join(', ') + ')' : ''}`}, depsPresupuesto(p),
    (fm.length || sifen) ? 'Esto borra el registro en el sistema, pero la factura emitida sigue existiendo en la DNIT (e-Kuatia). Si corresponde, anulala allá.' : '')) { S.detailId = null; renderLayer(); } }
async function eliminarFacturaRegistro(pid){ const p = S.presupuestos.find(x => x.id === pid); if (!p) return; const act = facturaManualActiva(p);
  const ok = await dialog('Eliminar registro de factura', `Se borra del sistema el registro de la factura <b>${esc(act ? act.numero : '')}</b> (también los registros anulados de este presupuesto). <b>No anula la factura en e-Kuatia'i.</b><label class="row small" style="margin-top:12px"><input type="checkbox" id="delOk"> Entiendo que no se puede deshacer</label>`, 'Eliminar', () => $('#delOk').checked || (toast('Marcá la confirmación'), false));
  if (ok) await patchPres(pid, {facturasManual: [], factura: null}, `Registro de factura eliminado por administrador${act ? ' (N° ' + act.numero + ')' : ''}`); }
async function eliminarCliente(id){ const c = S.clientes.find(x => x.id === id); if (!c) return; const ps = presDeCliente(id);
  let incluir = false;
  if (ps.length) { const r = await dialog('El cliente tiene presupuestos', `<p style="margin-top:0">${esc(c.nombre)} tiene ${ps.length} presupuesto${ps.length > 1 ? 's' : ''}.</p>
    <label class="row small"><input type="radio" name="dc" value="no" checked> Eliminar solo el cliente (los presupuestos se conservan, sin cliente agendado)</label>
    <label class="row small" style="margin-top:6px"><input type="radio" name="dc" value="si"> Eliminar también sus presupuestos y cobros</label>`, 'Continuar', () => document.querySelector('input[name=dc]:checked').value);
    if (!r) return; incluir = r === 'si'; }
  const deps = incluir ? ps.flatMap(p => [{col:'presupuestos', id:p.id, txt:p.numero}, ...depsPresupuesto(p)]) : [];
  if (await eliminarRegistros(`Eliminar cliente`, {col:'clientes', id, txt:c.nombre}, deps) && !incluir) {
    for (const p of ps) { const d = clone(p); delete d.id; if (d.cliente) delete d.cliente.clienteId; try { await put('presupuestos', p.id, d); } catch(e) {} } } }
async function eliminarMov(id){ const m = (S.movimientos || []).find(x => x.id === id); if (!m) return;
  await eliminarRegistros('Eliminar movimiento', {col:'movimientos', id, txt:`${m.tipo} ${gs(m.monto)} del ${fDate(m.fecha)}${m.concepto ? ' · ' + m.concepto : ''}`}, [], m.tipo === 'egreso' ? `La orden ${esc(m.opId)} vuelve a "aprobada, por pagar".` : ''); }
async function eliminarOP(id){ const o = (S.ordenes || []).find(x => x.id === id); if (!o) return;
  await eliminarRegistros(`Eliminar ${id}`, {col:'ordenes', id, txt:`${o.beneficiario} · ${gs(o.monto)} (${o.estado})`}, depsOP(o)); }
async function eliminarCompra(id){ const c = (S.compras || []).find(x => x.id === id); if (!c) return;
  await eliminarRegistros('Eliminar compra', {col:'compras', id, txt:`${provNombre(c.proveedorId)} · Fact. ${c.numeroFactura || 's/n'} · ${gs(c.total)}`}, depsCompra(c)); }
async function eliminarProveedor(id){ const p = (S.proveedores || []).find(x => x.id === id); if (!p) return;
  const cs = (S.compras || []).filter(c => c.proveedorId === id);
  await eliminarRegistros('Eliminar proveedor', {col:'proveedores', id, txt:p.nombre}, cs.flatMap(c => [{col:'compras', id:c.id, txt:`Fact. ${c.numeroFactura || 's/n'} · ${gs(c.total)}`}, ...depsCompra(c)])); }
async function eliminarAsiento(id){ const a = (S.asientos || []).find(x => x.id === id); if (a) await eliminarRegistros('Eliminar asiento', {col:'asientos', id, txt:`${fDate(a.fecha)} · ${a.glosa}`}, []); }
async function eliminarAjuste(id){ const a = (S.stockajustes || []).find(x => x.id === id); if (a) await eliminarRegistros('Eliminar ajuste de stock', {col:'stockajustes', id, txt:`${fDate(a.fecha)} · ${(matById(a.materialId) || {}).nombre || ''} ${a.cantidad} · ${a.motivo}`}, []); }
async function eliminarFondo(id){ const f = (S.fondos || []).find(x => x.id === id); if (!f) return;
  const ms = (S.movimientos || []).filter(m => m.fondoId === id || m.fondoDestinoId === id);
  await eliminarRegistros('Eliminar cuenta de dinero', {col:'fondos', id, txt:f.nombre}, ms.map(m => ({col:'movimientos', id:m.id, txt:`${m.tipo} ${gs(m.monto)} del ${fDate(m.fecha)}`})), ms.length ? 'Si preferís conservar la historia, mejor desactivá la cuenta (Editar → Activa).' : ''); }

/* --- permisos de usuario --- */
async function cambiarPermiso(id, campo, valor){
  const { error } = await S.sb.from('perfiles').update({ [campo]: valor }).eq('user_id', id);
  if (error) { toast('No se pudo cambiar: ' + error.message.replace(/^.*?: /, '')); render(); return; }
  const u = S.perfiles.find(x => x.user_id === id); if (u) u[campo] = valor; aplicarPerfiles(); render(); toast('Permiso actualizado');
}


/* ============ IMPORTAR / EXPORTAR CATÁLOGO (Excel) ============ */
const XLSX_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
function cargarXLSX(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, mal) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = () => ok(window.XLSX); s.onerror = () => mal(new Error('No se pudo cargar el lector de Excel. Revisá la conexión.')); document.head.appendChild(s); }); }
const ROL_TXT = {placa:'Placa', perfil:'Perfil', espuma:'Espuma', cierre:'Cierre', manija:'Manija', bisagra:'Bisagra', esquinero:'Esquinero', consumible:'Consumibles', otro:'Otro'};
function rolDeTexto(t){ const n = normTxt(t); if (!n) return 'otro'; if (n.startsWith('consum')) return 'consumible'; const k = Object.keys(ROL_TXT).find(k => n.startsWith(k)); return k || 'otro'; }
function numXls(v){
  if (typeof v === 'number') return v; let s = String(v ?? '').replace(/[₲Gg$\s]/g, '').replace(/s\.?$/i, '');
  if (!s) return NaN;
  if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
function filasHoja(wb, nombre){
  const hn = wb.SheetNames.find(n => normTxt(n) === normTxt(nombre)); if (!hn) return null;
  const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[hn], {header:1, defval:'', raw:true});
  if (!rows.length) return [];
  const head = rows[0].map(normTxt);
  return rows.slice(1).map((r, i) => ({fila: i + 2, r})).filter(x => x.r.some(c => String(c).trim() !== '') && !['obligatorio','opcional'].includes(normTxt(x.r[0])))
    .map(x => { const o = {_fila: x.fila}; head.forEach((h, j) => o[h] = x.r[j]); return o; });
}
const col = (o, ...pref) => { const k = Object.keys(o).find(k => pref.some(p => k.startsWith(p))); return k ? o[k] : ''; };

function analizarCatalogo(wb){
  const R = {matN:[], matU:[], proN:[], proU:[], errores:[], avisos:[], recetas:{}};
  const mats = filasHoja(wb, 'Materiales') || [], pros = filasHoja(wb, 'Productos') || [], recs = filasHoja(wb, 'Recetas') || [];
  if (!mats.length && !pros.length && !recs.length) { R.errores.push('El archivo no tiene datos en las hojas Materiales, Productos o Recetas. ¿Es la plantilla de LFL?'); return R; }
  const porNombre = new Map(S.materiales.map(m => [normTxt(m.nombre), m]));
  const vistos = new Set();
  mats.forEach(o => {
    const nombre = String(col(o, 'material', 'nombre')).trim(), unidad = String(col(o, 'unidad')).trim(), precio = numXls(col(o, 'precio')), rol = rolDeTexto(col(o, 'rol')), prov = String(col(o, 'proveedor')).trim();
    const k = normTxt(nombre); const f = `Materiales fila ${o._fila}`;
    if (!nombre) { R.errores.push(`${f}: falta el nombre.`); return; }
    if (vistos.has(k)) { R.errores.push(`${f}: "${nombre}" está repetido en el archivo.`); return; } vistos.add(k);
    if (!unidad) { R.errores.push(`${f}: falta la unidad de "${nombre}".`); return; }
    if (!(precio >= 0)) { R.errores.push(`${f}: precio inválido para "${nombre}" (${col(o,'precio')}).`); return; }
    const ex = porNombre.get(k); const data = {nombre, rol, unidad, precio:Math.round(precio), proveedor:prov, ejemplo:false};
    if (ex) { const cambios = ['nombre','rol','unidad','precio','proveedor'].filter(c => String(ex[c] ?? '') !== String(data[c] ?? '')); if (cambios.length || ex.ejemplo) R.matU.push({id:ex.id, data:{...((({id, ...x}) => x)(ex)), ...data, actualizado:now()}, antes:ex, cambios}); }
    else R.matN.push({id:'m-' + uid(), data:{...data, creado:now()}});
  });
  // materiales disponibles para recetas = app + archivo
  const matFinal = new Map(S.materiales.map(m => [normTxt(m.nombre), m.id])); R.matN.forEach(m => matFinal.set(normTxt(m.data.nombre), m.id));
  const porCod = new Map(S.productos.map(p => [normTxt(p.codigo), p]));
  const codArchivo = new Set();
  pros.forEach(o => {
    const cod = String(col(o, 'codigo')).trim().toUpperCase(), nombre = String(col(o, 'nombre')).trim(), horas = numXls(col(o, 'horas')), ivaT = normTxt(col(o, 'iva'));
    const f = `Productos fila ${o._fila}`;
    if (!cod) { R.errores.push(`${f}: falta el código.`); return; }
    if (codArchivo.has(cod)) { R.errores.push(`${f}: el código ${cod} está repetido.`); return; } codArchivo.add(cod);
    if (!nombre) { R.errores.push(`${f}: falta el nombre de ${cod}.`); return; }
    if (!(horas > 0)) { R.errores.push(`${f}: horas inválidas para ${cod} (${col(o,'horas')}).`); return; }
    const tasaIva = !ivaT ? null : ivaT.startsWith('ex') || ivaT === '0' ? 0 : +ivaT === 5 ? 5 : +ivaT === 10 ? 10 : 'X';
    if (tasaIva === 'X') { R.errores.push(`${f}: IVA debe ser 10, 5 o Exento (${col(o,'iva')}).`); return; }
    const pa = numXls(col(o, 'precio'));
    const data = {codigo:cod, nombre, medidas:String(col(o, 'medida')).trim(), horas, tasaIva, precioActual: pa > 0 ? Math.round(pa) : null, notas:String(col(o, 'nota')).trim()};
    const ex = porCod.get(normTxt(cod));
    if (ex) R.proU.push({id:ex.id, data:{...((({id, ...x}) => x)(ex)), ...data, actualizado:now()}, antes:ex});
    else R.proN.push({id:'p-' + uid(), data:{...data, bom:[], creado:now()}});
  });
  recs.forEach(o => {
    const cod = String(col(o, 'codigo')).trim().toUpperCase(), mat = String(col(o, 'material')).trim(), cant = numXls(col(o, 'cantidad'));
    const f = `Recetas fila ${o._fila}`;
    if (!cod || !mat) { R.errores.push(`${f}: falta código de producto o material.`); return; }
    const mid = matFinal.get(normTxt(mat)); if (!mid) { R.errores.push(`${f}: el material "${mat}" no existe (cargalo en la hoja Materiales).`); return; }
    if (!(cant > 0)) { R.errores.push(`${f}: cantidad inválida (${col(o,'cantidad')}).`); return; }
    if (!codArchivo.has(cod) && !porCod.has(normTxt(cod))) { R.errores.push(`${f}: el producto ${cod} no existe (cargalo en la hoja Productos).`); return; }
    (R.recetas[cod] = R.recetas[cod] || []).push({materialId:mid, cant});
  });
  // aplicar recetas
  Object.entries(R.recetas).forEach(([cod, bom]) => {
    let x = R.proN.find(p => p.data.codigo === cod) || R.proU.find(p => p.data.codigo === cod);
    if (!x) { const ex = porCod.get(normTxt(cod)); x = {id:ex.id, data:{...((({id, ...y}) => y)(ex)), actualizado:now()}, antes:ex}; R.proU.push(x); }
    x.data.bom = bom; x.recetaNueva = true;
  });
  // descartar productos sin cambios reales
  const firma = d => JSON.stringify([d.codigo, d.nombre, d.medidas || '', +d.horas || 0, d.tasaIva ?? null, d.precioActual || null, d.notas || '', (d.bom || []).map(b => [b.materialId, +b.cant])]);
  R.proU = R.proU.filter(x => { const igual = firma(x.data) === firma(x.antes); if (x.recetaNueva) x.recetaNueva = JSON.stringify((x.data.bom || []).map(b => [b.materialId, +b.cant])) !== JSON.stringify((x.antes.bom || []).map(b => [b.materialId, +b.cant])); return !igual; });
  R.proN.filter(p => !p.data.bom.length).forEach(p => R.avisos.push(`${p.data.codigo} no tiene materiales en la hoja Recetas: su costo de materiales va a ser 0.`));
  return R;
}
async function importarCatalogo(){
  if (!S.canAdmin) { toast('Solo los socios pueden importar el catálogo'); return; }
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let R;
    try { const X = await cargarXLSX(); const wb = X.read(await f.arrayBuffer(), {type:'array'}); R = analizarCatalogo(wb); }
    catch(e) { toast('No se pudo leer el archivo: ' + e.message); return; }
    const lista = (t, arr, fn) => arr.length ? `<details ${arr.length <= 8 ? 'open' : ''}><summary><b>${t} (${arr.length})</b></summary><ul class="small" style="margin:4px 0 8px;padding-left:18px">${arr.map(fn).join('')}</ul></details>` : '';
    const total = R.matN.length + R.matU.length + R.proN.length + R.proU.length;
    const ok = await dialog(`Importar ${esc(f.name)}`, `<div style="max-height:60vh;overflow:auto">
      ${R.errores.length ? `<div class="note bad" style="margin-bottom:10px">${IC.warn}<div><b>${R.errores.length} error${R.errores.length > 1 ? 'es' : ''}</b> (esas filas no se importan):<ul style="margin:4px 0 0;padding-left:16px">${R.errores.slice(0, 30).map(e => `<li>${esc(e)}</li>`).join('')}${R.errores.length > 30 ? `<li>…y ${R.errores.length - 30} más</li>` : ''}</ul></div></div>` : ''}
      ${R.avisos.length ? `<div class="note warn" style="margin-bottom:10px">${IC.warn}<div>${R.avisos.map(esc).join('<br>')}</div></div>` : ''}
      ${lista('Materiales nuevos', R.matN, m => `<li>${esc(m.data.nombre)} · ${esc(m.data.unidad)} · ${gs(m.data.precio)}</li>`)}
      ${lista('Materiales que se actualizan', R.matU, m => `<li>${esc(m.data.nombre)}${m.cambios.includes('precio') ? ` · precio ${gs(m.antes.precio)} → <b>${gs(m.data.precio)}</b>` : ''}${m.cambios.filter(c => c !== 'precio').length ? ' · cambia ' + m.cambios.filter(c => c !== 'precio').join(', ') : ''}${!m.cambios.length && m.antes.ejemplo ? ' · deja de ser "ejemplo"' : ''}</li>`)}
      ${lista('Productos nuevos', R.proN, p => `<li><b>${esc(p.data.codigo)}</b> ${esc(p.data.nombre)} · ${fmtN(p.data.horas, 2)} h · ${p.data.bom.length} materiales</li>`)}
      ${lista('Productos que se actualizan', R.proU, p => `<li><b>${esc(p.data.codigo)}</b> ${esc(p.data.nombre)}${p.recetaNueva ? ` · receta reemplazada (${p.data.bom.length} materiales)` : ''}</li>`)}
      ${!total ? '<p>No hay cambios para importar.</p>' : '<p class="small muted" style="margin:6px 0 0">Nada se borra. Los presupuestos ya guardados no cambian; los nuevos usan los precios actualizados.</p>'}</div>`, total ? `Importar ${total} registro${total > 1 ? 's' : ''}` : 'Cerrar');
    if (!ok || !total) return;
    try {
      await guardarVarios('materiales', [...R.matN, ...R.matU]);
      await guardarVarios('productos', [...R.proN, ...R.proU]);
      toast(`Catálogo actualizado: ${total} registro${total > 1 ? 's' : ''}`);
    } catch(e) { toast('Error al guardar: ' + (e.message || e)); }
  };
  inp.click();
}
async function guardarVarios(colec, items){
  if (!items.length) return;
  if (S.mode === 'supa') {
    for (let i = 0; i < items.length; i += 200) {

/* ---------- geometría de cases a medida (mm) con reglas editables ---------- */
function geoCase(l, a, h, peso){
  const R = reglas(); l=+l||0; a=+a||0; h=+h||0; const pared = 2 * ((+R.espesorPanel||0) + (+R.espesorEspuma||0));
  const L = l + pared, A = a + pared, H = h + pared;
  const areaExt = 2*(L*A + L*H + A*H)/1e6, areaInt = 2*(l*a + l*h + a*h)/1e6, merma = 1 + (+R.mermaCorte||0)/100;
  const q = {placa: areaExt*merma, espuma: areaInt*merma, perfil: 4*(L+A+H)/1000, perfilcierre: 4*(L+A)/1000,
    esquinero:+R.esquineros, cierre: L <= +R.cierresHasta ? +R.cierresChico : +R.cierresGrande, manija:+R.manijas,
    bisagra: L <= +R.bisagrasHasta ? +R.bisagrasChico : +R.bisagrasGrande, rueda: (+peso||0) >= +R.ruedasPesoKg ? +R.ruedas : 0, consumible:1};
  const lineas = [];
  Object.entries(q).forEach(([rol, cant]) => { if (!(cant > 0)) return; const m = matByRol(rol); if (m) lineas.push({materialId:m.id, nombre:m.nombre, unidad:m.unidad, precio:+m.precio||0, cant:Math.round(cant*100)/100}); });
  return {lineas, horas: Math.round(((+R.horasBase||0) + (+R.horasPorM2||0) * areaExt) * 4) / 4, ext:{L, A, H}, areaExt};
}
